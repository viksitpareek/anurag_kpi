function cardHtml(title, value, colorClass, category, sub) {
    var clickableClass = category ? " clickable" : "";
    var dataAttr = category ? ' data-cat="' + category + '"' : "";
    var idAttr = category ? ' id="card-' + category + '"' : "";
    var subId = category ? ' id="card-sub-' + category + '"' : "";
    return '<div class="card"><div class="card-title">' + escapeHtml(title) + '</div>' +
        '<div class="card-value ' + colorClass + clickableClass + '"' + idAttr + dataAttr + '>' + value + '</div>' +
        '<div class="card-sub"' + subId + '>' + (sub || "") + '</div></div>';
}


function setCardValue(category, value) {
    var el = document.getElementById("card-" + category);
    if (!el) return;
    el.innerText = value;
    el.classList.remove("waiting");
}


function setCardSub(category, html) {
    var el = document.getElementById("card-sub-" + category);
    if (el) el.innerHTML = html || "";
}


function percentText(part, whole) {
    part = Number(part || 0);
    whole = Number(whole || 0);
    if (!whole) return null;
    var pct = (part / whole) * 100;
    return (pct >= 10 || pct === 0 ? pct.toFixed(0) : pct.toFixed(1)) + "%";
}


function pctBadge(part, whole) {
    var text = percentText(part, whole);
    if (!text) return '<span class="pct none">No target</span>';
    var pct = (Number(part) / Number(whole)) * 100;
    var cls = pct >= 100 ? "good" : (pct >= 70 ? "ok" : "low");
    return '<span class="pct ' + cls + '">' + text + '</span>';
}


function accountShareSub(count, total) {
    var pct = percentText(count, total);
    return pct ? '<strong>' + pct + '</strong> of ' + Number(total).toLocaleString("en-IN") + ' accounts' : "";
}


function targetShareSub(amountLakh, targetLakh) {
    var pct = percentText(amountLakh, targetLakh);
    return pct ? '<strong>' + pct + '</strong> of ' + formatLakh(targetLakh) + ' target' : "No target set";
}


function accountsLabel(n) {
    return Number(n).toLocaleString("en-IN") + (n === 1 ? " account" : " accounts");
}


function formatLakh(value) {
    var number = Number(value);
    if (isNaN(number)) number = 0;
    return number.toFixed(2) + " L";
}


function updateAmountCards(cards, targetLakh, pipelineAccounts, leftOut) {

    var dateNames = {
        achieved: "Actual Order Date",
        payment_received: "Payment Receiving Date",
        payment_pending: "Closing Date",
        current_pipeline: "Expected Order Date"
    };

    function leftOutLine(category) {
        var l = leftOut && leftOut[category];
        if (!l || !l.count) return "";
        return '<br><span style="color:#b45309;">' + formatLakh(l.amount_lakh) + ' (' + l.count + (l.count === 1 ? ' deal' : ' deals') +
            ') left out: ' + dateNames[category] + ' not in ' + FY_LONG_LABEL + '</span>';
    }

    CARD_CATEGORIES.forEach(function(category) {
        setCardValue(category, formatLakh(cards[category]));
    });

    setCardSub("achieved", targetShareSub(cards.achieved, targetLakh) + leftOutLine("achieved"));
    setCardSub("payment_received", targetShareSub(cards.payment_received, targetLakh) + leftOutLine("payment_received"));
    setCardSub("payment_pending", leftOutLine("payment_pending").replace(/^<br>/, ""));
    setCardSub("current_pipeline", '<strong>' + accountsLabel(Object.keys(pipelineAccounts || {}).length) + '</strong>' +
        leftOutLine("current_pipeline"));
}


function renderBucketTable(bucketSummary) {

    var buckets = Object.keys(bucketSummary || {}).sort(function(a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    if (buckets.length === 0) return '<div class="loading">No accounts for the selected filters.</div>';

    var html = '<div class="table-scroll"><table><thead><tr><th style="text-align:left;">Bucket</th>' +
        '<th>Total</th><th>Open Deals</th><th>Closed Lost</th><th>Closed Won</th>' +
        '<th>Last 30 Days</th><th>31-60 Days</th><th>60+ Days</th><th>Non-Touched</th><th>Lost - No Follow-up</th></tr></thead><tbody>';

    var grand = { Total: 0, open_deals: 0, closed_lost: 0, closed_won: 0, last_30: 0, days_31_60: 0, days_60_plus: 0, non_touched: 0, lost_nf: 0 };

    function bucketCell(count, category) {
        if (count && count > 0) return '<td class="clickable plain" data-cat="' + escapeHtml(category) + '">' + count + '</td>';
        return '<td>' + (count || 0) + '</td>';
    }

    buckets.forEach(function(bucket) {

        var row = bucketSummary[bucket];
        var prefix = "bucket:" + encodeURIComponent(bucket) + ":";

        html += '<tr><td class="row-label">' + escapeHtml(bucket) + '</td>';
        html += bucketCell(row.Total, prefix + "Total");
        html += bucketCell(row.open_deals, prefix + "open_deals");
        html += bucketCell(row.closed_lost, prefix + "closed_lost");
        html += bucketCell(row.closed_won, prefix + "closed_won");
        html += bucketCell(row.last_30, prefix + "last_30");
        html += bucketCell(row.days_31_60, prefix + "days_31_60");
        html += bucketCell(row.days_60_plus, prefix + "days_60_plus");
        html += bucketCell(row.non_touched, prefix + "non_touched");
        html += bucketCell(row.lost_nf, prefix + "lost_nf");
        html += '</tr>';

        Object.keys(grand).forEach(function(key) { grand[key] += Number(row[key] || 0); });
    });

    html += '<tr class="grand-total"><td class="row-label">Grand Total</td>' +
        '<td>' + grand.Total + '</td><td>' + grand.open_deals + '</td><td>' + grand.closed_lost + '</td><td>' +
        grand.closed_won + '</td><td>' + grand.last_30 + '</td>' +
        '<td>' + grand.days_31_60 + '</td><td>' + grand.days_60_plus + '</td>' +
        '<td>' + grand.non_touched + '</td><td>' + grand.lost_nf + '</td></tr>';

    return html + '</tbody></table></div>';
}


/* ---- Target vs Achievement ---- */

/*
 * "Others": achievement (Achieved card rules) that doesn't belong to any sales team,
 * e.g. deals owned by other users, or GIST HQ deals whose Gist Account Owner has no team.
 */
/* Personal view: an "Others" row only when the user has no sales team row of their own */
function othersInScope(ownerNames) {
    return teamRowsInScope(ownerNames, currentGistSelection()).length === 0;
}


function othersDealMatches(ctx, ownerNames) {
    if (teamIndexForDeal(ctx) !== -1) return false;
    if (ownerNames.length === ALLOWED_ACCOUNT_OWNERS.length) return true;   // All Owners: any user
    return ownerNames.some(function(n) { return n.trim().toLowerCase() === ctx.dealOwnerName.trim().toLowerCase(); });
}


function computeOthers(live, ownerNames, gistSelection) {
    var o = { achievedFY: 0, achieved: {}, who: {} };
    QUARTERS.forEach(function(q) { o.achieved[q] = 0; });
    live.deals.forEach(function(deal) {
        var ctx = dealContext(deal, live, ALL_QUARTERS, gistSelection, true);
        if (!ctx || !cardStageMatch(ctx, "achieved") || !othersDealMatches(ctx, ownerNames)) return;
        o.achievedFY += ctx.amount;
        o.achieved[ctx.dateQuarters.actual] += ctx.amount;
        var who = isGistHqName(ctx.dealOwnerName) && ctx.account && ctx.account.gistNames.length
            ? ctx.account.gistNames.join(", ") : (ctx.dealOwnerName || "Unassigned");
        o.who[who] = true;
    });
    return o;
}


function renderTeamTable(teams, live, ownerNames, gistSelection, selectedQuarter) {

    var wrap = document.getElementById("teamTargetWrap");
    if (!wrap) return;

    var rows = teamRowsInScope(ownerNames, gistSelection);
    var showOthers = othersInScope(ownerNames);
    var others = showOthers ? computeOthers(live, ownerNames, gistSelection) : null;

    // Accounts behind each team: same population as the Total Accounts card
    var ownerSet = ownerSetFromNames(ownerNames, live).set;
    var teamAccounts = SALES_TEAM_TARGETS.map(function() { return 0; });
    var otherAccounts = 0;
    filterAccounts(live, ownerSet, gistSelection).forEach(function(a) {
        if (a.teamIndex >= 0) teamAccounts[a.teamIndex]++;
        else otherAccounts++;
    });

    if (rows.length === 0 && !showOthers) {
        wrap.innerHTML = '<div class="loading">No sales team target is set for this selection. ' +
            'Add it to SALES_TEAM_TARGETS at the top of the widget.</div>';
        return;
    }

    var single = selectedQuarter !== ALL_QUARTERS;
    var nowQuarter = currentFyQuarter();

    var html = '<div class="table-scroll"><table class="team-table"><thead><tr>';
    html += '<th style="text-align:left;">Sales Manager</th><th>FY Target</th>';

    if (single) {
        html += '<th>' + selectedQuarter + ' Target</th><th>' + selectedQuarter + ' Achieved</th><th>Achv %</th>';
    } else {
        html += '<th>FY Achieved</th><th>Achv %</th>';
        QUARTERS.forEach(function(q) {
            html += '<th' + (q === nowQuarter ? ' class="current-q"' : '') + '>' + q +
                '<br><span style="font-weight:400;font-size:11px;">Achieved / Target</span></th>';
        });
    }

    html += '</tr></thead><tbody>';

    var total = { fy: 0, fyAchieved: 0, qTarget: {}, qAchieved: {}, month: 0, pipelineA: 0 };

    QUARTERS.forEach(function(q) { total.qTarget[q] = 0; total.qAchieved[q] = 0; });

    rows.forEach(function(item) {

        var row = item.row;
        var t = teams[item.index];
        var fyAchieved = t.achievedFY;
        var idx = item.index;

        html += '<tr><td class="row-label">' + escapeHtml(row.team) +
            '<span class="sub">' + accountsLabel(teamAccounts[idx] || 0) + '</span></td>';
        html += '<td>' + formatLakh(teamFyTarget(row)) + '</td>';

        if (single) {
            var qt = teamQuarterTarget(row, selectedQuarter);
            var qa = t.achieved[selectedQuarter];
            html += '<td>' + formatLakh(qt) + '</td>';
            html += teamAmountCell(qa, "team:" + idx + ":" + selectedQuarter + ":achieved");
            html += '<td>' + pctBadge(qa, qt) + '</td>';
        } else {
            html += teamAmountCell(fyAchieved, "team:" + idx + ":FY:achieved");
            html += '<td>' + pctBadge(fyAchieved, teamFyTarget(row)) + '</td>';
            QUARTERS.forEach(function(q) {
                var target = teamQuarterTarget(row, q);
                var achieved = t.achieved[q];
                html += '<td class="q-cell' + (achieved ? ' clickable' : '') + '"' +
                    (achieved ? ' data-cat="team:' + idx + ':' + q + ':achieved"' : '') + '>' +
                    '<span class="big">' + formatLakh(achieved) + '</span>' +
                    '<span class="small">of ' + formatLakh(target) + '</span>' + pctBadge(achieved, target) + '</td>';
            });
        }

        html += '</tr>';


        total.fy += teamFyTarget(row);
        total.fyAchieved += fyAchieved;
        QUARTERS.forEach(function(q) {
            total.qTarget[q] += teamQuarterTarget(row, q);
            total.qAchieved[q] += t.achieved[q];
        });
    });

    if (showOthers) {
        var whoList = Object.keys(others.who).sort();
        html += '<tr><td class="row-label">Others<span class="sub">' + accountsLabel(otherAccounts) + ' &middot; ' +
            escapeHtml(whoList.length ? whoList.slice(0, 4).join("; ") + (whoList.length > 4 ? " and " + (whoList.length - 4) + " more" : "") : "no achievement") +
            '</span></td>';
        html += '<td>' + formatLakh(0) + '</td>';
        if (single) {
            html += '<td>' + formatLakh(0) + '</td>';
            html += teamAmountCell(others.achieved[selectedQuarter], "team:others:" + selectedQuarter + ":achieved");
            html += '<td>' + pctBadge(others.achieved[selectedQuarter], 0) + '</td>';
        } else {
            html += teamAmountCell(others.achievedFY, "team:others:FY:achieved");
            html += '<td>' + pctBadge(others.achievedFY, 0) + '</td>';
            QUARTERS.forEach(function(q) {
                var a = others.achieved[q];
                html += '<td class="q-cell' + (a ? ' clickable' : '') + '"' + (a ? ' data-cat="team:others:' + q + ':achieved"' : '') + '>' +
                    '<span class="big">' + formatLakh(a) + '</span><span class="small">of ' + formatLakh(0) + '</span>' + pctBadge(a, 0) + '</td>';
            });
        }
        html += '</tr>';

        total.fyAchieved += others.achievedFY;
        QUARTERS.forEach(function(q) { total.qAchieved[q] += others.achieved[q]; });
    }

    if (rows.length + (showOthers ? 1 : 0) > 1) {
        html += '<tr class="grand-total"><td class="row-label">Total</td><td>' + formatLakh(total.fy) + '</td>';
        if (single) {
            html += '<td>' + formatLakh(total.qTarget[selectedQuarter]) + '</td><td>' +
                formatLakh(total.qAchieved[selectedQuarter]) + '</td><td>' +
                pctBadge(total.qAchieved[selectedQuarter], total.qTarget[selectedQuarter]) + '</td>';
        } else {
            html += '<td>' + formatLakh(total.fyAchieved) + '</td><td>' + pctBadge(total.fyAchieved, total.fy) + '</td>';
            QUARTERS.forEach(function(q) {
                html += '<td class="q-cell"><span class="big">' + formatLakh(total.qAchieved[q]) + '</span>' +
                    '<span class="small">of ' + formatLakh(total.qTarget[q]) + '</span>' +
                    pctBadge(total.qAchieved[q], total.qTarget[q]) + '</td>';
            });
        }
        html += '</tr>';
    }

    html += '</tbody></table></div>';

    html += '<div class="data-source">Achieved uses the Achieved card rules: deal owner, Closed Won stages, Deal Type New, ' +
        'Deal Year ' + FY_FILTER + ' and Actual Order Date in ' + FY_LONG_LABEL + ' (the quarter comes from the Actual Order Date). ' +
        GIST_HQ_OWNER_NAME + ' deals are split into teams by the account\'s Gist Account Owner. The account count under each ' +
        'team uses the same accounts as the Total Accounts card, so the teams plus Others add up to it.</div>';

    var mismatched = rows.filter(function(item) {
        var sum = QUARTERS.reduce(function(t, q) { return t + teamQuarterTarget(item.row, q); }, 0);
        return Math.abs(sum - teamFyTarget(item.row)) > 0.005;
    }).map(function(item) {
        var sum = QUARTERS.reduce(function(t, q) { return t + teamQuarterTarget(item.row, q); }, 0);
        return item.row.team + " (FY " + formatLakh(teamFyTarget(item.row)) + ", quarters " + formatLakh(sum) + ")";
    });

    if (mismatched.length) {
        html += '<div class="warn-note">FY target does not equal the four quarter targets for: ' +
            mismatched.map(escapeHtml).join(", ") + '. Fix the numbers in SALES_TEAM_TARGETS.</div>';
    }

    var unmatched = live.gistValues.filter(function(name) {
        if (name === GIST_NOT_ASSIGNED) return false;
        return !SALES_TEAM_TARGETS.some(function(row) { return gistNameMatchesKeywords(name, row.gist); });
    });

    if (unmatched.length && ownerNames.some(isGistHqName)) {
        html += '<div class="data-source">Gist Account Owners without a team target (not in this table): ' +
            unmatched.map(escapeHtml).join(", ") + '.</div>';
    }

    var emptyTeams = rows.filter(function(item) {
        return teamFyTarget(item.row) > 0 && !teamAccounts[item.index];
    }).map(function(item) { return item.row.team; });

    if (emptyTeams.length) {
        html += '<div class="warn-note">No accounts matched: ' + emptyTeams.map(escapeHtml).join(", ") +
            '. Check the owner names or Gist words for these teams in SALES_TEAM_TARGETS.</div>';
    }

    wrap.innerHTML = html;
}

}


function lakhCell(bucket, category, extraClass, showAccounts) {

    var count = Number((bucket && bucket.count) || 0);
    var accountCount = bucket && bucket.accounts ? Object.keys(bucket.accounts).length : 0;

        escapeHtml(f.amount.label) + ' (' + escapeHtml(f.amount.api) + ', read as ' + amountUnitInUse +
        '), Plan = ' + escapeHtml(f.plan.label) + ' (' + escapeHtml(f.plan.api) +
        '), Product = ' + escapeHtml(f.product.label) + ' (' + escapeHtml(f.product.api) +
        '), Deal Type = ' + escapeHtml(f.dealType.label) + ' (' + escapeHtml(f.dealType.api) +
        '), Expected Order Date = ' + escapeHtml(f.expectedOrderDate.api) +
        ', Actual Order Date = ' + escapeHtml(f.actualOrderDate.api) +
        ', Payment Receiving Date = ' + escapeHtml(f.paymentDate.api) +
        ', Payment Received Amount = ' + escapeHtml(f.paymentAmount.api) + ' (read as ' + paymentAmountUnitInUse + ')' +
        ', Closing Date = ' + escapeHtml(f.closingDate.api) +
        '), Year = ' + escapeHtml(f.year.label) + ' (' + escapeHtml(f.year.api) +
        '), Gist Account Owner = ' + escapeHtml(f.gist.label) + ' (' + escapeHtml(f.gist.api) + ').</div>';

    var warnings = [];

    [["expectedOrderDate", "Expected Order Date"], ["actualOrderDate", "Actual Order Date"],
     ["paymentDate", "Payment Receiving Date"], ["paymentAmount", "Payment Received Amount"],
     ["closingDate", "Closing Date"]].forEach(function(pair) {
        if (!f[pair[0]].found) {
            warnings.push('No "' + pair[1] + '" field was found on Deals, so everything that depends on it shows 0. ' +
                'Set <code>DEAL_FIELDS.' + pair[0] + '</code> to its API name.');
        }
    });
    if ((missingOwners || []).length) {
        warnings.push('No accounts found for ' + missingOwners.map(escapeHtml).join(", ") +
            '. Check the spelling in <code>ALLOWED_ACCOUNT_OWNERS</code>.');
    }
    if (!f.dealType.found) {
        warnings.push('No Deal Type field with the value "New" was found, so deals are NOT filtered by Deal Type. ' +
            'Set <code>DEAL_FIELDS.dealType</code> to its API name, or check <code>DEAL_TYPE_VALUES</code>.');
    } else if (live.yearDealCount > 0 && live.fyDealCount === 0) {
        warnings.push('No ' + FY_FILTER + ' deal has Deal Type ' + escapeHtml(DEAL_TYPE_VALUES.join(" / ")) +
            '. Check the exact picklist value and update <code>DEAL_TYPE_VALUES</code>.');
    }
    if (live.deals.length > 0 && live.yearDealCount === 0) {
        warnings.push('No deal has Deal Year ' + FY_FILTER + '. Set <code>DEAL_FIELDS.year</code> to your Deal Year API name.');
    }
    if (live.outsideWindow > 0) {
        warnings.push(live.outsideWindow + ' deals have Deal Year ' + FY_FILTER + ' but their stage date (Expected Order Date ' +
            'for open stages, Actual Order Date for Closed Won, Closing Date for Closed Lost) is blank or outside 1 Apr ' +
            FY_START_YEAR + ' - 31 Mar ' + (FY_START_YEAR + 1) + ', so they are not counted.');
    }
    if (!/expected ?business/i.test(f.amount.label + " " + f.amount.api.replace(/_/g, " "))) {
        warnings.push('No "Expected Business" field was found on Deals, so amounts use "' + escapeHtml(f.amount.label) +
            '". Set <code>DEAL_FIELDS.amount</code> to the Expected Business API name.');
    }
    if (!f.product.found) {
        warnings.push('No Product field was found, so Knimbus Default deals cannot be left out. Set ' +
            '<code>DEAL_FIELDS.product</code> to its API name.');
    }
    if (m.chartDeals > 0 && m.dealsWithAmount === 0) warnings.push('Every Expected Business amount is 0 for these filters.');
    if (m.chartDeals > 0 && m.dealsWithPlan === 0) {
        warnings.push('No deal has a value in "' + escapeHtml(f.plan.label) + '". Set <code>DEAL_FIELDS.plan</code> ' +
            'to the API name of your Plan field.');
    }

    warnings.forEach(function(w) { html += '<div class="warn-note">' + w + '</div>'; });

    return html;
}


/* ---- Funnel ---- */

function groupSubLabel(group) {
    var def = STAGE_GROUPS.filter(function(g) { return g.name === group; })[0];
    return def && def.show ? def.show.join(", ") : "";
}


function stageColor(group, index) {
    if (group === "Closed Lost") return "#dc2626";
    if (group === "Closed Won") return "#059669";
    var blues = ["#1f4e78", "#1d5fa8", "#2563eb", "#3b82f6", "#60a5fa"];
    return blues[index % blues.length];
}


function renderStageFunnel(m) {

    var wrap = document.getElementById("stageFunnelWrap");
    if (!wrap) return;

    // Always the nine stage groups, in the order set in STAGE_GROUPS
    var groups = STAGE_GROUPS.map(function(g) { return g.name; });
    var empty = { amount_lakh: 0, count: 0, accounts: {} };

    function totalsFor(group) { return m.groupTotals[group] || empty; }

    var maxAmount = Math.max.apply(null, groups.map(function(g) { return totalsFor(g).amount_lakh; }));
    var maxCount = Math.max.apply(null, groups.map(function(g) { return totalsFor(g).count; }));
    var useAmount = maxAmount > 0;

    var totalAmount = 0;
    var totalCount = 0;
    var html = '<div class="funnel">';

    groups.forEach(function(group, i) {

        var t = totalsFor(group);
        var ratio = useAmount ? t.amount_lakh / maxAmount : (maxCount ? t.count / maxCount : 0);
        var width = t.count ? Math.max(3, Math.round(ratio * 100)) : 0;
        var sub = groupSubLabel(group);

        totalAmount += t.amount_lakh;
        totalCount += t.count;

        html += '<div class="funnel-row' + (t.count ? ' clickable" data-cat="stage:' + escapeHtml(encodeURIComponent(group)) +
                '" title="Click to see accounts"' : '"') + '>' +
            '<div class="funnel-stage">' + (i + 1) + '. ' + escapeHtml(group) +
                (sub ? '<span class="sub">' + escapeHtml(sub) + '</span>' : '') + '</div>' +
            '<div class="funnel-track"><div class="funnel-bar" style="width:' + width + '%;background:' + stageColor(group, i) + ';"></div></div>' +
            '<div class="funnel-value"><span class="big">' + formatLakh(t.amount_lakh) + '</span>' +
            '<span class="small">' + t.count + (t.count === 1 ? ' deal' : ' deals') + ', ' +
            accountsLabel(Object.keys(t.accounts).length) + '</span></div>' +
            '</div>';
    });

    html += '</div><div class="funnel-total">All stages: <strong>' + formatLakh(totalAmount) + '</strong> across ' +
        totalCount + ' deals</div>';
    html += '<div class="data-source">Counts DEALS (the Account Owner Summary counts accounts) and leaves out Knimbus Default ' +
        'and the Renewal Notice stages, so Closed Won and Closed Lost here are smaller than in that table.</div>';

    var others = Object.keys(m.groupTotals).filter(function(g) { return groups.indexOf(g) === -1; }).sort();
    if (others.length) {
        html += '<div class="data-source">Stages not in this list and not shown: ' + others.map(function(g) {
            return escapeHtml(g) + ' (' + formatLakh(m.groupTotals[g].amount_lakh) + ', ' + m.groupTotals[g].count + (m.groupTotals[g].count === 1 ? ' deal)' : ' deals)');
        }).join(", ") + '.</div>';
    }

    wrap.innerHTML = html;
}

function toggleGistBreakdown(event) {
    if (event) event.stopPropagation();
    aorGistExpanded = !aorGistExpanded;
    renderAccountOwnerSummary();
    if (aorGistExpanded) ensureGistBreakdown();
}


function ensureGistBreakdown() {

    if (!aorLive || !aorLive.ownerStats || aorLive.gistBreakdown || aorLive.gistBreakdownLoading) return;

    var state = aorLive;
    var live = state.live;
    var gistId = live.ownerIdByName[GIST_HQ_OWNER_NAME.toLowerCase()];

    state.gistBreakdownLoading = true;

    (gistId ? getOwnerCalls(gistId) : Promise.resolve([])).then(function(calls) {

        if (aorLive !== state) return;

        var set = {};
        if (gistId) set[gistId] = true;

        var names = live.gistValues.filter(function(v) {
            return !state.gistSelection.length || state.gistSelection.indexOf(v) !== -1;
        });

        state.gistBreakdown = names.map(function(name) {
            var accounts = gistId ? filterAccounts(live, set, name) : [];
            var wl = state.wonLost.gist[name] || { won: {}, lost: {} };
            return {
                name: name,
                stats: computeAccountStats(accounts, calls),
                won: Object.keys(wl.won).length,
                lost: Object.keys(wl.lost).length
            };
        }).filter(function(g) { return g.stats.total || g.won || g.lost; });

        state.gistBreakdownLoading = false;
        renderAccountOwnerSummary();
        attachDrilldownHandlers();

    }).catch(function(err) {
        console.error("Gist breakdown error:", err);
        state.gistBreakdownLoading = false;
        state.gistBreakdown = [];
        renderAccountOwnerSummary();
    });
}


function renderAccountOwnerSummary() {

    var container = document.getElementById("accountOwnerSummarySection");
    if (!aorLive) return;

    var live = aorLive.live;
    var PENDING = "…";
    var keys = ["total_accounts", "last_30", "days_31_60", "days_60_plus", "touched", "non_touched", "lost_nf", "closed_won", "closed_lost"];
    var categories = ["total_accounts", "aging:last_30", "aging:days_31_60", "aging:days_60_plus", "touched", "untouched", "lost_no_followup", "won_accounts", "lost_accounts"];

    function cell(value, ownerName, category, gistName) {
        if (value === PENDING) return '<td>' + PENDING + '</td>';
        value = value || 0;
        if (value > 0) {
            return '<td class="clickable plain" data-cat="' + escapeHtml(category) + '" data-owners="' + escapeHtml(ownerName) + '"' +
                (gistName ? ' data-gist="' + escapeHtml(gistName) + '"' : '') + '>' + value + '</td>';
        }
        return '<td>0</td>';
    }

    function rowValues(stats, won, lost) {
        if (!stats) {
            return { total_accounts: PENDING, last_30: PENDING, days_31_60: PENDING, days_60_plus: PENDING,
                     touched: PENDING, non_touched: PENDING, lost_nf: PENDING, closed_won: won, closed_lost: lost };
        }
        return { total_accounts: stats.total, last_30: stats.last_30, days_31_60: stats.days_31_60,
                 days_60_plus: stats.days_60_plus, touched: stats.touched, non_touched: stats.untouched,
                 lost_nf: stats.lost, closed_won: won, closed_lost: lost };
    }

    var html = '<div class="table-scroll"><table><thead><tr>';
    html += '<th style="text-align:left;">Account Owner</th><th>Total</th><th>Last 30</th>';
    html += '<th>31-60</th><th>60+</th><th>Touched</th><th>Non-Touched</th><th>Lost - No Follow-up</th><th>Closed Won<br><span style="font-weight:400;font-size:11px;">accounts</span></th>' +
        '<th>Closed Lost<br><span style="font-weight:400;font-size:11px;">accounts</span></th>';
    html += '</tr></thead><tbody>';

    var grand = {};
    keys.forEach(function(k) { grand[k] = 0; });
    var grandPending = false;

    aorLive.ownerNames.forEach(function(ownerName) {

        var ownerId = live.ownerIdByName[ownerName.trim().toLowerCase()];
        var wl = aorLive.wonLost.owners[ownerId] || { won: {}, lost: {} };
        var stats = aorLive.ownerStats ? aorLive.ownerStats[ownerName] : null;
        var row = rowValues(stats, Object.keys(wl.won).length, Object.keys(wl.lost).length);
        var isGist = isGistHqName(ownerName);

        var gistPersonal = personalScope && personalScope.mode === "gist";
        html += '<tr><td class="row-label">' + escapeHtml(gistPersonal ? personalScope.label : ownerName) +
            (isGist && !gistPersonal ? '<button class="expand-btn" onclick="toggleGistBreakdown(event)">' +
                (aorGistExpanded ? "Hide Gist account owners" : "Show Gist account owners") + '</button>' : '') + '</td>';
        keys.forEach(function(k, i) { html += cell(row[k], ownerName, categories[i]); });
        html += '</tr>';

        keys.forEach(function(k) {
            if (row[k] === PENDING) grandPending = true;
            else grand[k] += Number(row[k] || 0);
        });

        if (isGist && aorGistExpanded) {
            if (!aorLive.gistBreakdown) {
                html += '<tr class="sub-row"><td class="row-label" colspan="10">Calculating Gist account owners...</td></tr>';
            } else if (aorLive.gistBreakdown.length === 0) {
                html += '<tr class="sub-row"><td class="row-label" colspan="10">No Gist Account Owner values found.</td></tr>';
            } else {
                aorLive.gistBreakdown.forEach(function(g) {
                    var subRow = rowValues(g.stats, g.won, g.lost);
                    html += '<tr class="sub-row"><td class="row-label">' + escapeHtml(g.name) + '</td>';
                    keys.forEach(function(k, i) { html += cell(subRow[k], ownerName, categories[i], g.name); });
                    html += '</tr>';
                });
            }
        }
    });

    if (aorLive.ownerNames.length > 1) {
        html += '<tr class="grand-total"><td class="row-label">Grand Total</td>';
        keys.forEach(function(k) {
            var pending = grandPending && ["closed_won", "closed_lost"].indexOf(k) === -1;
            html += '<td>' + (pending ? PENDING : grand[k]) + '</td>';
        });
        html += '</tr>';
    }

    html += '</tbody></table></div>';
    html += '<div class="data-source">Accounts with at least one Deal Type New deal. Closed Won and Closed Lost count ACCOUNTS ' +
        'with a deal in that stage group (Deal Year ' + FY_FILTER + ', Actual Order Date / Closing Date in the selected period), ' +
        'including Knimbus Default. The Stage-wise funnel counts DEALS and leaves Knimbus Default out, so its numbers are smaller.</div>';

    container.innerHTML = html;

    container.querySelectorAll(".clickable").forEach(function(el) {
        el.onclick = function() {
            var gist = el.getAttribute("data-gist");
            var owner = el.getAttribute("data-owners");
            openDrilldown({ names: [owner], gist: gist ? [gist] : aorLive.gistSelection, label: owner + (gist ? " / " + gist : "") },
                el.getAttribute("data-cat"));
        };
    });
}

function zohoSearchAll(module, criteria) {

    return new Promise(function(resolve) {

        var allRecords = [];
        var page = 1;

        function fetchPage() {

            var searchPromise = criteria
                ? ZOHO.CRM.API.searchRecord({ Entity: module, Type: "criteria", Query: criteria, page: page, per_page: 200 })
                : ZOHO.CRM.API.getAllRecords({ Entity: module, sort_order: "asc", page: page, per_page: 200 });

            searchPromise
                .then(function(response) {
                    if (response && response.data) allRecords = allRecords.concat(response.data);
                    if (response && response.info && response.info.more_records === true && page < 150) {
                        page++;
                        fetchPage();
                    } else {
                        resolve(allRecords);
                    }
                })
                .catch(function(err) {
                    console.error(module + " fetch stopped on page " + page + ":", err);
                    resolve(allRecords);
                });
        }

        fetchPage();
    });
}


function ddLookupId(value) {
    if (value && typeof value === "object") return String(value.id || "");
    return String(value || "");
}


function ddLookupName(value, fallback) {
    if (value && typeof value === "object") return value.name || (fallback || "Unassigned");
    return fallback || "Unassigned";
}


/* Date-only values ("2026-04-01") are read as local dates, so 1 April stays in Q1 */
function ddParseDate(value) {
    if (!value) return null;
    var s = String(value).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
}


function monthQuarter(date) {
    if (!date) return null;
    var month = date.getMonth() + 1;
    if (month >= 4 && month <= 6) return "Q1";
    if (month >= 7 && month <= 9) return "Q2";
    if (month >= 10 && month <= 12) return "Q3";
    return "Q4";
}


function attachDrilldownHandlers() {
    document.querySelectorAll("#content .clickable").forEach(function(el) {
        el.onclick = function() {
            var category = el.getAttribute("data-cat");
            if (!category) return;
            openDrilldown({ names: effectiveOwnerNames(), gist: currentGistSelection(), label: ownersLabel() }, category);
        };
    });
}


function categoryLabel(category) {

    var labels = {
        "target": "Target",
        "achieved": "Achieved (Closed Won)",
        "payment_received": "Payment Received",
        "payment_pending": "Payment Pending",
        "current_pipeline": "Current Pipeline",
        "total_accounts": "Total Accounts",
        "untouched": "Untouched Accounts",
        "lost_no_followup": "Lost - No Follow-up",
        "touched": "Touched Accounts",
        "aging:last_30": "Touched in Last 30 Days",
        "aging:days_31_60": "Touched 31-60 Days Ago",
        "aging:days_60_plus": "Touched 60+ Days Ago",
        "won_accounts": "Closed Won Accounts",
        "lost_accounts": "Closed Lost Accounts"
    };

    if (labels[category]) return labels[category];

    var parts = category.split(":");

    if (parts[0] === "bucket") return decodeURIComponent(parts[1]) + " - " + parts[2].replace(/_/g, " ");
    if (parts[0] === "qp") return decodeURIComponent(parts[1]) + " " + decodeURIComponent(parts[2]) + " Expected Business";
    if (parts[0] === "quarter_pipeline") return decodeURIComponent(parts[1]) + " Pipeline (by account owner)";
    if (parts[0] === "stage") return decodeURIComponent(parts[1]);
    if (parts[0] === "team") {
        var row = parts[1] === "others" ? { team: "Others" } : (SALES_TEAM_TARGETS[Number(parts[1])] || { team: "Team" });
        var period = parts[2] === "FY" ? FY_LONG_LABEL : parts[2];
        return row.team + ", " + period + (parts[3] === "pipelineA" ? " Pipeline (Plan A)" : " Achieved");
    }

    return category;
}


var CARD_DETAIL_CATEGORIES = ["target", "achieved", "payment_received", "payment_pending",
    "total_accounts", "untouched", "touched", "lost_no_followup", "current_pipeline"];


function openDrilldown(scope, category) {

    var modal = document.getElementById("drilldownModal");
    var box = document.getElementById("drilldownBox");
    var title = document.getElementById("drilldownTitle");
    var body = document.getElementById("drilldownBody");
    var isDetail = CARD_DETAIL_CATEGORIES.indexOf(category) !== -1;

    var isTeam = category.indexOf("team:") === 0;
    title.innerText = (isTeam ? "" : scope.label + " - ") + categoryLabel(category) +
        (isDetail ? " (" + periodLabel(currentQuarterSelection()) + ")" : "");
    body.innerHTML = "Loading...";

    box.classList.toggle("wide", isDetail);
    positionModal(modal, box);
    modal.classList.add("open");

    var work = isDetail ? runCardDetail(scope, category) : runDrilldown(scope, category).then(renderNameList);

    work
        .then(function(html) {
            body.innerHTML = html;
            positionModal(modal, box);
        })
        .catch(function(err) {
            body.innerHTML = '<div class="modal-empty">Failed to load records.</div>';
            console.error("Drilldown error:", err);
        });
}


/* Place the popup near the click, kept inside the page */
function positionModal(modal, box) {
    var pageHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    modal.style.height = pageHeight + "px";
    var boxHeight = box.offsetHeight || 400;
    var top = Math.max(10, Math.min(lastClickY - 60, pageHeight - boxHeight - 10));
    box.style.top = top + "px";
}


function renderNameList(names) {
    if (!names || names.length === 0) return '<div class="modal-empty">No matching records found.</div>';
    var html = '<div class="modal-count">' + accountsLabel(names.length) + '</div><ul>';

    return html + "</ul>";
}


function fmtDate(value) {
    if (!value) return "—";
    var d = ddParseDate(value);
    if (!d) return escapeHtml(String(value));
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return ("0" + d.getDate()).slice(-2) + "-" + months[d.getMonth()] + "-" + d.getFullYear();
}


function detailValue(info, deal, account) {
    if (!info || !info.found) return "—";
    var record = info.module === "Deals" ? deal : (account && account.raw);
    var value = record ? record[info.api] : null;
    if (value === null || value === undefined || value === "") return "—";
    if (/date/i.test(info.label + " " + info.api)) return fmtDate(fieldValueText(value));
    return escapeHtml(fieldValueText(value));
}


function latestDeal(deals) {
    return (deals || []).slice().sort(function(a, b) {
        return String(b.Modified_Time || b.Created_Time || "").localeCompare(String(a.Modified_Time || a.Created_Time || ""));
    })[0] || null;
}


function detailTable(columns, rows, summaryHtml) {
    if (!rows.length) return (summaryHtml || "") + '<div class="modal-empty">No matching records found.</div>';
    var html = (summaryHtml || "") + '<div class="table-scroll"><table class="detail-table"><thead><tr>';
    columns.forEach(function(c) { html += '<th class="' + (c.logic ? "logic" : "") + '">' + escapeHtml(c.title) + '</th>'; });

    });

}

async function runCardDetail(scope, category) {

    var live = await loadLiveData();
    var ownerSet = ownerSetFromNames(scope.names, live).set;
    var gistSelection = scope.gist || [];
    var selectedQuarter = currentQuarterSelection();

    // ---- Target ----
    if (category === "target") {
        var teamRows = teamRowsInScope(scope.names, gistSelection);
        var rowsT = teamRows.map(function(item) {
            var row = item.row;
            var r = {
                team: escapeHtml(row.team),
                matchedBy: escapeHtml((row.owners || []).length ? "Owner: " + row.owners.join(", ") : "Gist Account Owner contains: " + (row.gist || []).join(", ")),
                fy: formatLakh(teamFyTarget(row)),
                period: formatLakh(teamTarget(row, selectedQuarter))
            };
            QUARTERS.forEach(function(q) { r[q] = formatLakh(teamQuarterTarget(row, q)); });
            return r;
        });
        var colsT = [{ key: "team", title: "Sales Team", left: true }, { key: "matchedBy", title: "Matched by", left: true },
            { key: "fy", title: "FY Target" }]
            .concat(QUARTERS.map(function(q) { return { key: q, title: q + " Target" }; }))
            .concat([{ key: "period", title: "Target for " + (selectedQuarter === ALL_QUARTERS ? "FY" : selectedQuarter), logic: true }]);
        var sumT = teamRows.reduce(function(s, item) { return s + teamTarget(item.row, selectedQuarter); }, 0);
        return detailTable(colsT, rowsT, '<div class="modal-summary"><strong>' + teamRows.length + (teamRows.length === 1 ? ' team' : ' teams') + '</strong>, total target <strong>' +
            formatLakh(sumT) + '</strong>. Targets come from SALES_TEAM_TARGETS in the widget.</div>');
    }

    // ---- Deal cards ----
    if (CARD_LOGIC[category]) {

        var logic = CARD_LOGIC[category];
        var rows = [];
        var total = 0;
        var accountSet = {};

        live.deals.forEach(function(deal) {

            var ctx = dealContext(deal, live, selectedQuarter, gistSelection, true);
            if (!ctx || !matchesCardCategory(ctx, category, ownerSet)) return;

            total += cardAmount(ctx, category);
            accountSet[ctx.accId] = true;

            rows.push({
                sortKey: ctx.accName.toLowerCase(),
                deal: escapeHtml(deal.Deal_Name || "(No name)"),
                account: escapeHtml(ctx.accName),
                owner: escapeHtml(ctx.dealOwnerName || "—"),
                accountOwner: escapeHtml(ctx.account ? ctx.account.ownerName : "—"),
                stage: escapeHtml(ctx.stage),
                logicDate: fmtDate(fieldValueText(deal[fieldInfo[logic.dateKey].api])) + " (" + (ctx.dateQuarters[logic.quarterKey] || "—") + ")",
                expectedBusiness: formatLakh(ctx.amount),
                paymentReceivedAmount: formatLakh(ctx.paymentAmount),
                paymentReceivingDate: fmtDate(fieldValueText(deal[fieldInfo.paymentDate.api])),
                ouCode: detailValue(fieldInfo.ouCode, deal, ctx.account),
                subStartDate: detailValue(fieldInfo.subStartDate, deal, ctx.account),
                dealYear: escapeHtml(dealFiscalYear(deal) || "—"),
                dealType: escapeHtml(fieldValueText(deal[fieldInfo.dealType.api]) || "—"),
                product: escapeHtml(ctx.products.join(", ") || "—"),
                plan: escapeHtml(ctx.plan)
            });
        });

        rows.sort(function(a, b) { return a.sortKey.localeCompare(b.sortKey); });

        var cols = [
            { key: "deal", title: "Deal", left: true },
            { key: "account", title: "Account", left: true },
            { key: "owner", title: "Owner", left: true }
        ];
        if (category === "current_pipeline") cols.push({ key: "accountOwner", title: "Account Owner", left: true, logic: true });
        cols = cols.concat([
            { key: "stage", title: "Stage", left: true, logic: true },
            { key: "logicDate", title: logic.dateTitle + " (Quarter)", logic: true }
        ]);
        if (category === "payment_received") {
            cols.push({ key: "paymentReceivedAmount", title: "Payment Received Amount", logic: true });
            cols.push({ key: "expectedBusiness", title: "Expected Business" });
        } else {
            cols.push({ key: "expectedBusiness", title: "Expected Business", logic: true });
            cols.push({ key: "paymentReceivingDate", title: "Payment Receiving Date" });
        }
        cols = cols.concat([
            { key: "ouCode", title: "OU Code" },
            { key: "subStartDate", title: "Sub Start Date" },
            { key: "dealYear", title: "Deal Year", logic: true },
            { key: "dealType", title: "Deal Type", logic: true },
            { key: "product", title: "Product", logic: category === "current_pipeline" },
            { key: "plan", title: "Plan" }
        ]);

        var summary = '<div class="modal-summary"><strong>' + rows.length + (rows.length === 1 ? ' deal' : ' deals') + '</strong>, ' +
            accountsLabel(Object.keys(accountSet).length) + ', total <strong>' + formatLakh(total) + '</strong>.<br>Rule: ' +
            escapeHtml(logic.rule) + (selectedQuarter !== ALL_QUARTERS ? ", " + logic.dateTitle + " in " + selectedQuarter : "") +
            '. Highlighted columns are the ones the rule checks.' + missingDetailNote() + '</div>';

        return detailTable(cols, rows, summary);
    }

    // ---- Account cards ----
    var accounts = filterAccounts(live, ownerSet, gistSelection);
    var calls = await getCallsForOwners(ownerSet);
    var latest = latestOwnerCalls(accounts, calls);
    var now = new Date();
    var rowsA = [];
    var ebTotal = 0;
    var showGist = accounts.some(function(a) { return a.gistNames.length; });

    accounts.forEach(function(account) {

        var lastCall = latest[account.id];
        if (category === "lost_no_followup" && !account.lostOnly) return;
        if (category === "untouched" && (lastCall || account.lostOnly)) return;
        if (category === "touched" && (!lastCall || account.lostOnly)) return;

        var newDeals = live.newDealsByAccount[account.id] || [];
        var fyNewDeals = newDeals.filter(function(d) { return dealFiscalYear(d) === FY_FILTER; });
        var eb = fyNewDeals.reduce(function(s, d) { return s + dealAmountLakh(d); }, 0);
        var ref = latestDeal(fyNewDeals.length ? fyNewDeals : newDeals);
        ebTotal += eb;

        var lostDeals = newDeals.filter(function(d) { return isClosedLostStage(d.Stage); });
        var lastLost = lostDeals.map(function(d) { return ddParseDate(d[fieldInfo.closingDate.api]); })
            .filter(Boolean).sort(function(a, b) { return b - a; })[0];

        var status = "Untouched";
        if (account.lostOnly) {
            status = "Lost - No Follow-up";
        } else if (lastCall) {
            var age = agingOf(lastCall);
            status = age === "last_30" ? "Touched, last 30 days" : (age === "days_31_60" ? "Touched, 31-60 days" : "Touched, 60+ days");
        }

        rowsA.push({
            sortKey: account.name.toLowerCase(),
            account: escapeHtml(account.name),
            owner: escapeHtml(account.ownerName),
            gist: escapeHtml(account.gistNames.join(", ") || "—"),
            bucket: escapeHtml(account.bucket),
            newDeals: String(newDeals.length),
            lastCall: lastCall ? fmtDate(lastCall.toISOString().slice(0, 10)) : "—",
            daysSince: lastCall ? String(Math.floor((now - lastCall) / 86400000)) : "—",
            status: status,
            lostDeals: String(lostDeals.length),
            lastLost: lastLost ? fmtDate(lastLost.toISOString().slice(0, 10)) : "—",
            expectedBusiness: formatLakh(eb),
            paymentReceivingDate: ref ? fmtDate(fieldValueText(ref[fieldInfo.paymentDate.api])) : "—",
            ouCode: detailValue(fieldInfo.ouCode, ref, account),
            subStartDate: detailValue(fieldInfo.subStartDate, ref, account)
        });
    });

    rowsA.sort(function(a, b) { return a.sortKey.localeCompare(b.sortKey); });

    var colsA = [
        { key: "account", title: "Account", left: true },
        { key: "owner", title: "Owner", left: true, logic: true }
    ];
    if (showGist) colsA.push({ key: "gist", title: "Gist Account Owner", left: true });
    colsA = colsA.concat([
        { key: "newDeals", title: "Deal Type New Deals", logic: true },
        { key: "lastCall", title: "Last Call by Owner", logic: category !== "total_accounts" },
        { key: "daysSince", title: "Days Since Call" },
        { key: "status", title: "Status", left: true, logic: category !== "total_accounts" },
        { key: "lostDeals", title: "Closed Lost Deals", logic: category === "lost_no_followup" },
        { key: "lastLost", title: "Last Closing Date (lost)" },
        { key: "bucket", title: "Bucket", left: true },
        { key: "expectedBusiness", title: "Expected Business (" + FY_SHORT_LABEL + ")" },
        { key: "paymentReceivingDate", title: "Payment Receiving Date" },
        { key: "ouCode", title: "OU Code" },
        { key: "subStartDate", title: "Sub Start Date" }
    ]);

    var ruleA = {
        total_accounts: "accounts of the selected owner with at least one Deal Type New deal",
        untouched: "active accounts (not Lost - No Follow-up) with no call by the account owner on the account or its deals",
        touched: "active accounts (not Lost - No Follow-up) with a call by the account owner on the account or its deals",
        lost_no_followup: "accounts whose every Deal Type New deal is Closed Lost / Approval for Close Lost. A call alone does not move them; reopen the deal to make the account active"
    }[category];

    var summaryA = '<div class="modal-summary"><strong>' + accountsLabel(rowsA.length) + '</strong>, Expected Business <strong>' +
        formatLakh(ebTotal) + '</strong>.<br>Rule: ' + escapeHtml(ruleA) + '. Expected Business is the sum of the account\'s Deal Type New ' +
        'deals with Deal Year ' + FY_FILTER + '; Payment Receiving Date comes from its latest Deal Type New deal; OU Code and Sub Start Date come from the account, or from its latest ' +
        'Deal Type New deal when the field is on Deals.' + missingDetailNote() + '</div>';

    return detailTable(colsA, rowsA, summaryA);
}


function missingDetailNote() {
    var missing = [["paymentDate", "Payment Receiving Date"], ["paymentAmount", "Payment Received Amount"], ["ouCode", "OU Code"], ["subStartDate", "Sub Start Date"]]
        .filter(function(pair) { return !fieldInfo[pair[0]].found; })
        .map(function(pair) { return pair[1]; });
    return missing.length ? '<br><span style="color:#b45309;">Not found in CRM: ' + missing.join(", ") +
        '. Set its API name in DETAIL_FIELDS at the top of the widget.</span>' : "";
}


function closeDrilldown() {
    document.getElementById("drilldownModal").classList.remove("open");
}


function sortNames(names) {
    return names.sort(function(a, b) { return String(a).toLowerCase().localeCompare(String(b).toLowerCase()); });
}


async function runDrilldown(scope, category) {

    var live = await loadLiveData();
    var ownerSet = ownerSetFromNames(scope.names, live).set;
    var gistSelection = scope.gist || [];
    var selectedQuarter = currentQuarterSelection();

    var parts = category.split(":");
    var kind = parts[0];
    var unique = {};

    // ---- Target vs Achievement ----
    if (kind === "team") {

        var isOthers = parts[1] === "others";
        var teamIndex = Number(parts[1]);
        var period = parts[2];

        live.deals.forEach(function(deal) {
            var ctx = dealContext(deal, live, ALL_QUARTERS, isOthers ? gistSelection : [], true);
            if (!ctx) return;
            if (isOthers ? !othersDealMatches(ctx, scope.names) : teamIndexForDeal(ctx) !== teamIndex) return;
            var isPipelineA = parts[3] === "pipelineA";
            var dealQuarter = isPipelineA ? ctx.dateQuarters.expected : ctx.dateQuarters.actual;
            if (period !== "FY" && dealQuarter !== period) return;
            var ok = isPipelineA
                ? cardStageMatch(ctx, "current_pipeline_all_products") && ctx.plan.trim().toLowerCase() === "plan a"
                : cardStageMatch(ctx, "achieved");
            if (ok) unique[ctx.accId] = ctx.accName;
        });

        return sortNames(Object.values(unique));
    }

    // ---- Deal-based ----
    var dealKinds = ["qp", "quarter_pipeline", "stage", "won_accounts", "lost_accounts"];

    if (CARD_CATEGORIES.indexOf(category) !== -1 || dealKinds.indexOf(kind) !== -1) {

        var isCard = CARD_CATEGORIES.indexOf(category) !== -1;

        live.deals.forEach(function(deal) {

            var ctx = dealContext(deal, live, selectedQuarter, gistSelection, isCard);
            if (!ctx) return;

            var ok = false;

            if (isCard) {
                ok = matchesCardCategory(ctx, category, ownerSet);
            } else if (matchesAccountOwner(ctx, ownerSet)) {
                if (kind === "won_accounts") {
                    ok = !isRemovedStage(ctx.stage) && isClosedWonStage(ctx.stage) && !ctx.excluded;
                } else if (kind === "lost_accounts") {
                    ok = isClosedLostStage(ctx.stage);
                } else if (chartEligible(ctx)) {
                    if (kind === "qp") {
                        ok = ctx.quarter === decodeURIComponent(parts[1]) && ctx.plan === decodeURIComponent(parts[2]) && countsAsExpected(ctx);
                    } else if (kind === "quarter_pipeline") {
                        ok = ctx.quarter === decodeURIComponent(parts[1]) && isPipelineDeal(ctx);
                    } else if (kind === "stage") {
                        ok = stageGroupOf(ctx.stage) === decodeURIComponent(parts[1]);
                    }
                }
            }

            if (ok) unique[ctx.accId] = ctx.accName;
        });

        return sortNames(Object.values(unique));
    }

    // ---- Account-based (Deal Type New accounts) ----
    var accounts = filterAccounts(live, ownerSet, gistSelection);

    if (category === "total_accounts") return sortNames(accounts.map(function(a) { return a.name; }));

    var calls = await getCallsForOwners(ownerSet);
    var latest = latestOwnerCalls(accounts, calls);
    var dealStatus = kind === "bucket" ? computeAccountDealStatus(live, selectedQuarter, gistSelection) : {};
    var matches = [];

    accounts.forEach(function(account) {

        var lastCall = latest[account.id];
        var age = lastCall ? agingOf(lastCall) : null;
        var isMatch = false;

        if (category === "lost_no_followup") isMatch = account.lostOnly;
        else if (category === "untouched") isMatch = !account.lostOnly && !lastCall;
        else if (category === "touched") isMatch = !account.lostOnly && !!lastCall;
        else if (kind === "aging") isMatch = !account.lostOnly && age === parts[1];
        else if (kind === "bucket" && account.bucket === decodeURIComponent(parts[1])) {
            var ds = dealStatus[account.id] || {};
            if (parts[2] === "Total") isMatch = true;
            else if (parts[2] === "open_deals") isMatch = !!ds.open;
            else if (parts[2] === "closed_lost") isMatch = !!ds.lost;
            else if (parts[2] === "closed_won") isMatch = !!ds.won;
            else if (parts[2] === "lost_nf") isMatch = account.lostOnly;
            else if (parts[2] === "non_touched") isMatch = !account.lostOnly && !lastCall;
            else isMatch = !account.lostOnly && age === parts[2];
        }

        if (isMatch) matches.push(account.name);
    });

    return sortNames(matches);
}


function escapeHtml(value) {
    if (value === undefined || value === null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
