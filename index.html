<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body { margin: 0; padding: 20px; font-family: Arial, Helvetica, sans-serif; background: #f5f7fa; color: #333; }

        .container { max-width: 1300px; margin: 0 auto; }

        .header {
            background: #ffffff; padding: 20px 25px; border-radius: 10px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }

        .header h1 { margin: 0 0 4px 0; font-size: 22px; color: #1f2937; }
        .header p { margin: 0; color: #6b7280; font-size: 13px; }

        .header-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 3px; }
        .filter-group label { font-size: 11px; color: #6b7280; }
        .filter-group.hidden { display: none; }
        .filter-group select { padding: 8px 12px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 14px; min-width: 190px; background: #ffffff; }

        .multi-select { position: relative; }
        .user-chip { padding: 8px 12px; border-radius: 6px; border: 1px solid #c7d2fe; background: #eef2ff; color: #3730a3;
            font-size: 14px; font-weight: 600; min-width: 190px; }
        .multi-button {
            padding: 8px 12px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 14px;
            min-width: 210px; background: #ffffff; text-align: left; cursor: pointer; color: #111827;
        }
        .multi-menu {
            display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; min-width: 230px;
            background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); padding: 6px 0;
        }
        .multi-select.open .multi-menu { display: block; }
        .multi-option { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 14px; color: #1f2937; cursor: pointer; }
        .multi-option:hover { background: #f3f4f6; }
        .multi-option.all { border-bottom: 1px solid #e5e7eb; font-weight: 600; }

        #refreshButton { background: #2563eb; color: #ffffff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
        #refreshButton:disabled { background: #9ca3af; }

        .last-updated { font-size: 12px; color: #6b7280; padding-bottom: 9px; }

        .card-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card-row.five { grid-template-columns: repeat(5, 1fr); }
        .card { background: #ffffff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .card-title { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
        .card-value { font-size: 26px; font-weight: bold; color: #111827; }
        .card-value.target { color: #7c3aed; }
        .card-value.achieved { color: #059669; }
        .card-value.pending { color: #d97706; }
        .card-value.waiting { color: #9ca3af; font-size: 18px; }
        .card-sub { font-size: 12px; color: #6b7280; margin-top: 6px; min-height: 15px; }
        .card-sub strong { color: #374151; }

        .section { background: #ffffff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .section h2 { margin: 0 0 15px 0; font-size: 17px; color: #1f2937; }
        .section h3 { margin: 22px 0 10px 0; font-size: 15px; color: #1f2937; }
        .section h3:first-of-type { margin-top: 0; }
        .section-note { font-size: 12px; color: #6b7280; margin: -8px 0 12px 0; }

        .table-scroll { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #d0d7de; padding: 8px 10px; text-align: center; font-size: 13px; }
        th { background: #1f4e78; color: #ffffff; }
        th.current-q { background: #15406a; box-shadow: inset 0 -3px 0 #f0b429; }
        td.row-label { text-align: left; font-weight: 600; }
        td.row-label .sub { display: block; font-weight: 400; font-size: 11px; color: #6b7280; }
        tr.grand-total { background: #d9eaf7; font-weight: 700; }
        tbody tr:nth-child(even) { background: #f7f9fb; }

        tr.sub-row td { background: #fbfcfe; font-size: 12px; }
        tr.sub-row td.row-label { font-weight: 400; padding-left: 28px; color: #374151; }

        .expand-btn {
            border: 1px solid #c7d2df; background: #ffffff; color: #1f4e78; border-radius: 4px;
            font-size: 11px; padding: 1px 6px; margin-left: 8px; cursor: pointer;
        }

        .loading { padding: 30px; text-align: center; color: #6b7280; }
        .error { padding: 15px; background: #fee2e2; border: 1px solid #fecaca; border-radius: 6px; color: #991b1b; font-size: 14px; }

        .card-value.clickable, td.clickable, .funnel-row.clickable { cursor: pointer; }
        .card-value.clickable, td.clickable .big, td.clickable.plain { text-decoration: underline; text-decoration-style: dotted; text-decoration-color: #93c5fd; }
        .card-value.clickable:hover, td.clickable:hover { opacity: 0.75; }

        /* The widget iframe can be taller than the screen, so the popup opens where you clicked */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.35); z-index: 100; }
        .modal-overlay.open { display: block; }
        .modal-box { position: absolute; left: 50%; transform: translateX(-50%); background: #ffffff; border-radius: 10px;
            max-width: 520px; width: 92%; max-height: 560px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .modal-box.wide { max-width: 1240px; width: 97%; max-height: 640px; }
        .modal-summary { font-size: 12px; color: #374151; margin-bottom: 8px; line-height: 1.5; }
        .modal-summary strong { color: #111827; }
        .detail-table th, .detail-table td { font-size: 12px; padding: 6px 8px; white-space: nowrap; }
        .detail-table th { position: sticky; top: 0; z-index: 1; }
        .detail-table td.left { text-align: left; }
        .detail-table td.logic { background: #fff7e6; font-weight: 600; }
        .detail-table th.logic { background: #b45309; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 16px; color: #1f2937; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1; }
        .modal-body { padding: 12px 20px; overflow-y: auto; }
        .modal-body ul { margin: 0; padding-left: 20px; }
        .modal-body li { padding: 4px 0; font-size: 13px; color: #374151; }
        .modal-empty { color: #6b7280; font-size: 13px; padding: 10px 0; }
        .modal-count { font-size: 12px; color: #6b7280; margin-bottom: 8px; }

        .eb-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .eb-tile { border: 1px solid #dbe3ec; border-left: 5px solid #1f4e78; border-radius: 7px; padding: 10px 14px; background: #f8fafc; }
        .eb-tile .label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .eb-tile .value { display: block; font-size: 20px; font-weight: 700; color: #111827; }
        .eb-tile .sub { display: block; font-size: 11px; color: #6b7280; margin-top: 2px; }

        .eb-table th { white-space: nowrap; }
        .plan-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.7); }

        .amount-cell .big { font-size: 15px; font-weight: 700; display: block; color: #1f2937; }
        .amount-cell .small { font-size: 11px; color: #6b7280; }
        .amount-cell.zero .big { color: #b6bec9; font-weight: 400; }
        .amount-cell.total-col { background: #eef6ff; }
        .amount-cell.total-col .big { color: #1457b8; }

        .mix-col { min-width: 160px; }
        .mix-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: #eef1f5; }
        .mix-bar span { display: block; height: 100%; }

        .pct { display: inline-block; margin-top: 3px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; }
        .pct.good { background: #d1fae5; color: #065f46; }
        .pct.ok { background: #fef3c7; color: #92400e; }
        .pct.low { background: #fee2e2; color: #991b1b; }
        .pct.none { background: #eef1f5; color: #6b7280; font-weight: 400; }

        .team-table td.q-cell .big { display: block; font-size: 14px; font-weight: 700; color: #1f2937; }
        .team-table td.q-cell .small { display: block; font-size: 11px; color: #6b7280; }

        .data-source { margin-top: 10px; font-size: 12px; color: #6b7280; line-height: 1.5; }
        .warn-note { margin-top: 10px; padding: 10px 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; color: #92400e; font-size: 13px; }
        .warn-note code { background: #fef3c7; padding: 1px 4px; border-radius: 3px; }

        .funnel { display: flex; flex-direction: column; gap: 6px; }
        .funnel-row { display: grid; grid-template-columns: 230px 1fr 140px; align-items: center; gap: 12px; padding: 4px 6px; border-radius: 6px; }
        .funnel-row:hover { background: #f3f4f6; }
        .funnel-stage { font-size: 13px; font-weight: 600; color: #1f2937; }
        .funnel-stage .sub { display: block; font-size: 11px; font-weight: 400; color: #6b7280; }
        .funnel-track { display: flex; justify-content: center; }
        .funnel-bar { height: 26px; border-radius: 4px; min-width: 6px; }
        .funnel-value { text-align: right; }
        .funnel-value .big { display: block; font-size: 14px; font-weight: 700; color: #1f2937; }
        .funnel-value .small { font-size: 11px; color: #6b7280; }
        .funnel-total { margin-top: 8px; padding-top: 10px; border-top: 1px solid #e5e7eb; font-size: 13px; color: #374151; text-align: right; }

        @media (max-width: 900px) {
            .card-row, .card-row.five { grid-template-columns: repeat(2, 1fr); }
            .funnel-row { grid-template-columns: 140px 1fr 100px; }
            .mix-col { display: none; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>My Dashboard</h1>
            <p>Your target, activity and pipeline (Deal Type: New)</p>
        </div>
        <div class="header-controls">
            <div class="filter-group">
                <label>Showing data for</label>
                <div id="currentUserLabel" class="user-chip">Identifying you...</div>
            </div>
            <div class="filter-group hidden" id="gistFilterGroup">
                <label>Gist account owner (select one or more)</label>
                <div class="multi-select" id="gistMulti">
                    <button type="button" class="multi-button" id="gistMultiButton" onclick="toggleGistMenu(event)">All Gist Account Owners &#9662;</button>
                    <div class="multi-menu" id="gistMultiMenu"></div>
                </div>
            </div>
            <div class="filter-group">
                <label for="quarterFilter">Quarter</label>
                <select id="quarterFilter" onchange="renderAll()"></select>
            </div>
            <button id="refreshButton" onclick="loadReport()">Refresh</button>
            <div class="last-updated" id="lastUpdated">Last Updated: -</div>
        </div>
    </div>

    <div id="content">
        <div class="loading">Loading dashboard...</div>
    </div>

    <div class="section">
        <h2 id="aorTitle">Account Owner Summary (FY 2026-27)</h2>
        <div id="accountOwnerSummarySection">
            <div class="loading">Loading account owner summary...</div>
        </div>
    </div>

</div>

<div class="modal-overlay" id="drilldownModal" onclick="if (event.target === this) closeDrilldown()">
    <div class="modal-box" id="drilldownBox">
        <div class="modal-header">
            <h3 id="drilldownTitle">Records</h3>
            <button class="modal-close" onclick="closeDrilldown()">&times;</button>
        </div>
        <div class="modal-body" id="drilldownBody">Loading...</div>
    </div>
</div>
<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/* Financial year: 1 April FY_START_YEAR to 31 March FY_START_YEAR + 1 */
var FY_START_YEAR = 2026;
var FY_FILTER = FY_START_YEAR + "-" + (FY_START_YEAR + 1);   // Deal Year (Year2) value

/*
 * Every deal needs Deal Year = FY_FILTER AND the date that matches its stage
 * inside the FY (1 Apr - 31 Mar). That date also decides the quarter:
 *   Open stages (pipeline)  -> Expected Order Date
 *   Closed Won (Achieved)   -> Actual Order Date
 *   Payment Received card   -> Payment Receiving Date (amount = Payment Received Amount)
 *   Payment Pending card    -> Closing Date
 *   Closed Lost             -> Closing Date
 */

/* Only deals with one of these Deal Type values are used anywhere on the dashboard */
var DEAL_TYPE_VALUES = ["New", "New Business"];

/*
 * Field API names. Leave "" to auto-detect. If the grey note under the
 * Quarter x Plan table shows the wrong field, type the correct API name
 * (Setup > Developer Hub > APIs & SDKs > API Names).
 */
var DEAL_FIELDS = {
    amount: "",        // "Expected Business"
    plan: "",          // Deal_Category, else a field labelled "Plan"
    year: "",          // Year2
    product: "",       // a field labelled "Product"
    dealType: "",          // Type / a field labelled "Deal Type"
    expectedOrderDate: "", // "Expected Order Date"
    actualOrderDate: "",   // "Actual Order Date"
    paymentDate: "",       // "Payment Receiving Date"
    paymentAmount: "",     // "Payment Received Amount" (used by the Payment Received card)
    closingDate: ""        // "Closing Date" (Closing_Date)
};
var ACCOUNT_GIST_FIELD = "";   // Accounts: "Gist Account Owner"

/* Extra columns in the top-card popups. "" = auto-detect (Deals field first, then Accounts) */
var DETAIL_FIELDS = {
    ouCode: "",              // "OU Code"
    subStartDate: ""         // "Sub Start Date" / "Subscription Start Date"
};

var AMOUNT_UNIT = "auto";      // "rupees", "lakh" or "auto"

/* Knimbus Default is left out of: the Current Pipeline card, Quarter x Plan, and the Stage-wise funnel */
var EXCLUDED_PRODUCTS = ["Knimbus Default"];
var PIPELINE_OPEN_STAGES_ONLY = true;
var PIPELINE_REQUIRE_SAME_OWNER = true;   // Current Pipeline card: deal owner must own the account
var EXCLUDE_LOST_FROM_EXPECTED = true;    // Closed Lost isn't counted as expected business

/* The dashboard only covers these account owners ("All Owners" = all of them) */
var ALLOWED_ACCOUNT_OWNERS = ["Anurag Mishra", "Tejal Pandya", "Ashish Kumar", "GIST HQ"];

/*
 * Accounts are counted (Total / Touched / Untouched, bucket table, summary)
 * only if they have at least one deal with Deal Type New (any Product).
 */
var GIST_HQ_OWNER_NAME = "GIST HQ";

/* ---- Stages ---- */

/* name = row shown in the funnel, stages = CRM stages merged into it, show = stages listed under the name */
var STAGE_GROUPS = [
    { name: "Qualification - Lead", stages: ["Qualification - Lead", "Qualification", "Lead"] },
    { name: "Met and Interested", stages: ["Met and Interested"] },
    { name: "Demonstrated and Queries Handled", stages: ["Demonstrated and Queries Handled"] },
    { name: "Proposal Sent", stages: ["Proposal Sent", "Budgetary Proposal"],
      show: ["Proposal Sent", "Budgetary Proposal"] },
    { name: "Negotiation & Review", stages: ["Negotiation/Review", "Negotiation & Review", "Negotiation and Review"] },
    { name: "Proforma Invoice Sent", stages: ["Proforma Invoice Sent"] },
    { name: "Invoice Sent", stages: ["Invoice Sent"] },
    { name: "Closed Won", stages: ["Email Confirmation", "PI Sent - Order Received", "Payment Received",
                                   "Part Payment Received", "Short Payment", "Closed Won"],
      show: ["Email Confirmation", "PI Sent - Order Received", "Payment Received", "Part Payment Received",
             "Short Payment"] },
    { name: "Closed Lost", stages: ["Closed Lost", "Approval for Close Lost"],
      show: ["Closed Lost", "Approval for Close Lost"] }
];

/* Deals in these stages are left out of the dashboard */
var REMOVED_STAGES = ["Renewal Notice Sent", "Renewal Notice to be Sent"];

var PAYMENT_RECEIVED_STAGES = ["Payment Received", "Short Payment", "Part Payment Received"];
var PAYMENT_PENDING_STAGES = ["Email Confirmation", "PI Sent - Order Received"];
var EXCLUDED_DEAL_NAME_WORDS = ["test", "trigya"];

/* ---- Sales team targets (in lakh) ----
 * owners: CRM account owners whose accounts belong to this row (exact name)
 * gist:   words matched inside the "Gist Account Owner" of GIST HQ accounts
 * q:      Q1, Q2, Q3, Q4 targets     fy: full-year target
 * monthTarget: current month target from the sales sheet
 */
var SALES_TEAM_TARGETS = [
    { team: "Karthik & Vivekananda",  gist: ["Karthik", "Vivekanand"],     fy: 50, q: [8, 12, 15, 15],      monthTarget: 4 },
    { team: "Girish, Ruchi & Prasad", gist: ["Girish", "Ruchi", "Prasad"], fy: 30, q: [5, 7, 9, 9],         monthTarget: 2.3 },
    { team: "Sharansh Gond",          gist: ["Sharansh"],                  fy: 25, q: [4, 7, 7, 7],         monthTarget: 2.3 },
    { team: "Anurag",                 owners: ["Anurag Mishra"],           fy: 45, q: [2, 10.5, 13, 19.5],  monthTarget: 2.5 },
    { team: "Tejal",                  owners: ["Tejal Pandya"],            fy: 30, q: [2.5, 7, 9, 11.5],    monthTarget: 1.75 },
    { team: "Ashish",                 owners: ["Ashish Kumar"],            fy: 25, q: [2.5, 4.5, 7.5, 10.5], monthTarget: 1.5 }
];

var PLAN_COLORS = { "Plan A": "#d64550", "Plan B": "#f0b429", "Plan C": "#e8919c", "No Plan": "#9ca3af" };
var EXTRA_PLAN_COLORS = ["#0ea5e9", "#8b5cf6", "#10b981", "#f97316", "#6b7280"];


/* =========================================================
   CONSTANTS / STATE
   ========================================================= */

var FY_SHORT_LABEL = "FY " + String(FY_START_YEAR).slice(2) + "-" + String(FY_START_YEAR + 1).slice(2);
var FY_LONG_LABEL = "FY " + FY_START_YEAR + "-" + String(FY_START_YEAR + 1).slice(2);
var FY_START = new Date(FY_START_YEAR, 3, 1, 0, 0, 0, 0);
var FY_END = new Date(FY_START_YEAR + 1, 2, 31, 23, 59, 59, 999);
var QUARTERS = ["Q1", "Q2", "Q3", "Q4"];

var QUARTER_INFO = {
    Q1: { range: "1 Apr - 30 Jun " + FY_START_YEAR },
    Q2: { range: "1 Jul - 30 Sep " + FY_START_YEAR },
    Q3: { range: "1 Oct - 31 Dec " + FY_START_YEAR },
    Q4: { range: "1 Jan - 31 Mar " + (FY_START_YEAR + 1) }
};

var ALL_QUARTERS = "All Quarters";
var GIST_NOT_ASSIGNED = "(Not assigned)";
var CARD_CATEGORIES = ["achieved", "payment_received", "payment_pending", "current_pipeline"];

var STAGE_TO_GROUP = {};
STAGE_GROUPS.forEach(function(g) {
    g.stages.forEach(function(s) { STAGE_TO_GROUP[normStage(s)] = g.name; });
});
var REMOVED_STAGE_KEYS = REMOVED_STAGES.map(normStage);
var CLOSED_WON_KEYS = STAGE_GROUPS.filter(function(g) { return g.name === "Closed Won"; })[0].stages.map(normStage);
var CLOSED_LOST_KEYS = STAGE_GROUPS.filter(function(g) { return g.name === "Closed Lost"; })[0].stages.map(normStage);
var PAYMENT_RECEIVED_KEYS = PAYMENT_RECEIVED_STAGES.map(normStage);
var PAYMENT_PENDING_KEYS = PAYMENT_PENDING_STAGES.map(normStage);

var selectedOwnerName = "All Owners";

/* Logged-in user and what they are allowed to see (set once at load) */
var currentUser = null;      // { id, name }
var personalScope = null;    // { ownerNames: [...], gist: [...], label }
var selectedGistNames = [];    // empty = all Gist Account Owners
var renderToken = 0;

var liveDataPromise = null;
var liveResolved = null;
var fieldInfo = null;
var amountUnitInUse = "rupees";
var paymentAmountUnitInUse = "rupees";
var callsCache = {};
var aorLive = null;
var aorGistExpanded = false;

populateQuarterFilter();

var lastClickY = 0;
document.addEventListener("click", function(event) { lastClickY = event.pageY || 0; }, true);

ZOHO.embeddedApp.on("PageLoad", function() { loadReport(); });
ZOHO.embeddedApp.init();


function normStage(stage) {
    return String(stage || "").trim().toLowerCase().replace(/\s+/g, " ");
}


/* =========================================================
   FILTERS
   ========================================================= */

function populateQuarterFilter() {
    var select = document.getElementById("quarterFilter");
    var html = '<option value="' + ALL_QUARTERS + '">All Quarters (1 Apr ' + FY_START_YEAR +
        ' - 31 Mar ' + (FY_START_YEAR + 1) + ')</option>';
    QUARTERS.forEach(function(q) {
        html += '<option value="' + q + '">' + q + ' (' + QUARTER_INFO[q].range + ')</option>';
    });
    select.innerHTML = html;
}


function populateOwnerFilter() {
    document.getElementById("currentUserLabel").innerText = personalScope ? personalScope.label :
        (currentUser ? currentUser.name : "Identifying you...");
}


/* Fixed to the logged-in user; there is no owner dropdown in this version */
function effectiveOwnerNames() {
    return personalScope ? personalScope.ownerNames.slice() : [];
}


function ownersLabel() {
    return personalScope ? personalScope.label : "";
}


function getCurrentUserSafe() {
    return ZOHO.CRM.CONFIG.getCurrentUser().then(function(data) {
        var u = (data && data.users && data.users[0]) || {};
        var name = u.full_name || [u.first_name, u.last_name].filter(Boolean).join(" ") || u.name || "";
        if (!u.id || !name) throw new Error("Could not identify the logged-in user.");
        return { id: String(u.id), name: name.trim() };
    });
}


/*
 * Account owner  -> sees their own accounts and deals.
 * Gist Account Owner (name appears as a Gist Account Owner on GIST HQ accounts and the
 * user owns no accounts) -> sees GIST HQ accounts where they are the Gist Account Owner.
 */
function resolvePersonalScope(live) {
    var lower = currentUser.name.toLowerCase();
    var ownsAccounts = !!live.ownerIdByName[lower];
    var gistMatch = live.gistValues.filter(function(v) {
        return v !== GIST_NOT_ASSIGNED && v.trim().toLowerCase() === lower;
    });

    if (!ownsAccounts && gistMatch.length) {
        return { ownerNames: [GIST_HQ_OWNER_NAME], gist: gistMatch, mode: "gist",
                 label: currentUser.name + " (Gist Account Owner)" };
    }
    return { ownerNames: [currentUser.name], gist: [], mode: "owner", label: currentUser.name };
}


function isGistHqName(name) {
    return String(name || "").trim().toLowerCase() === GIST_HQ_OWNER_NAME.toLowerCase();
}


function gistFilterVisible() {
    return false;   // Gist selection is fixed by the logged-in user in this version
}


function gistSelectionLabel(names) {
    if (!names || !names.length) return "All Gist Account Owners";
    if (names.length <= 2) return names.join(", ");
    return names.length + " Gist account owners";
}


function populateGistOwnerFilter() {

    var group = document.getElementById("gistFilterGroup");
    var menu = document.getElementById("gistMultiMenu");
    var showGist = gistFilterVisible();

    group.classList.toggle("hidden", !showGist);

    var values = liveResolved ? liveResolved.gistValues : [];

    // Drop selections that no longer exist
    if (liveResolved) selectedGistNames = selectedGistNames.filter(function(n) { return values.indexOf(n) !== -1; });

    var html = '<label class="multi-option all"><input type="checkbox" value="__all__" onchange="onGistCheckbox(this)"' +
        (selectedGistNames.length === 0 ? ' checked' : '') + '> All Gist Account Owners</label>';

    if (!liveResolved) html += '<div class="multi-option">Loading names...</div>';
    else if (values.length === 0) html += '<div class="multi-option">No Gist Account Owner values found</div>';

    values.forEach(function(name, i) {
        html += '<label class="multi-option"><input type="checkbox" data-index="' + i + '" onchange="onGistCheckbox(this)"' +
            (selectedGistNames.indexOf(name) !== -1 ? ' checked' : '') + '> ' + escapeHtml(name) + '</label>';
    });

    menu.innerHTML = html;
    document.getElementById("gistMultiButton").innerHTML = escapeHtml(gistSelectionLabel(selectedGistNames)) + ' &#9662;';
}


function toggleGistMenu(event) {
    if (event) event.stopPropagation();
    document.getElementById("gistMulti").classList.toggle("open");
}


document.addEventListener("click", function(event) {
    var box = document.getElementById("gistMulti");
    if (box && !box.contains(event.target)) box.classList.remove("open");
});


function onGistCheckbox(input) {

    var values = liveResolved ? liveResolved.gistValues : [];

    if (input.value === "__all__") {
        selectedGistNames = [];
    } else {
        var name = values[Number(input.getAttribute("data-index"))];
        if (input.checked) {
            if (name && selectedGistNames.indexOf(name) === -1) selectedGistNames.push(name);
        } else {
            selectedGistNames = selectedGistNames.filter(function(n) { return n !== name; });
        }
    }

    selectedGistNames = values.filter(function(n) { return selectedGistNames.indexOf(n) !== -1; });
    if (values.length && selectedGistNames.length === values.length) selectedGistNames = [];

    renderAll();
    document.getElementById("gistMulti").classList.add("open");
}


/* Array of selected Gist Account Owner names; empty = no Gist filter */
function currentGistSelection() {
    return personalScope ? personalScope.gist.slice() : [];
}


function currentQuarterSelection() {
    return document.getElementById("quarterFilter").value || ALL_QUARTERS;
}


function periodLabel(selectedQuarter) {
    if (!selectedQuarter || selectedQuarter === ALL_QUARTERS) return FY_LONG_LABEL;
    return FY_LONG_LABEL + ", " + selectedQuarter + " (" + QUARTER_INFO[selectedQuarter].range + ")";
}


function currentFyQuarter() {
    var today = new Date();
    if (today < FY_START) return "Q1";
    if (today > FY_END) return "Q4";
    return monthQuarter(today);
}


/* =========================================================
   SALES TEAM TARGETS
   ========================================================= */

function teamFyTarget(row) {
    if (typeof row.fy === "number") return row.fy;
    return (row.q || []).reduce(function(s, v) { return s + Number(v || 0); }, 0);
}


function teamQuarterTarget(row, quarter) {
    return Number((row.q || [])[QUARTERS.indexOf(quarter)] || 0);
}


function teamTarget(row, selectedQuarter) {
    return (!selectedQuarter || selectedQuarter === ALL_QUARTERS) ? teamFyTarget(row) : teamQuarterTarget(row, selectedQuarter);
}


function gistNameMatchesKeywords(name, keywords) {
    var lower = String(name || "").toLowerCase();
    return (keywords || []).some(function(k) { return k && lower.indexOf(String(k).trim().toLowerCase()) !== -1; });
}


function teamMatchesAccount(row, account) {
    var owner = account.ownerName.trim().toLowerCase();
    if ((row.owners || []).some(function(o) { return o.trim().toLowerCase() === owner; })) return true;
    if (isGistHqName(account.ownerName) && (row.gist || []).length) {
        return account.gistNames.some(function(n) { return gistNameMatchesKeywords(n, row.gist); });
    }
    return false;
}


function assignTeam(account) {
    for (var i = 0; i < SALES_TEAM_TARGETS.length; i++) {
        if (teamMatchesAccount(SALES_TEAM_TARGETS[i], account)) return i;
    }
    return -1;
}


/* Which target rows belong to the selected owners / Gist filter */
function teamRowsInScope(ownerNames, gistSelection) {

    var names = (ownerNames || []).map(function(n) { return n.trim().toLowerCase(); });
    var includesGist = (ownerNames || []).some(isGistHqName);

    return SALES_TEAM_TARGETS.map(function(row, index) { return { row: row, index: index }; }).filter(function(item) {

        var row = item.row;

        if ((row.owners || []).some(function(o) { return names.indexOf(o.trim().toLowerCase()) !== -1; })) return true;

        if (includesGist && (row.gist || []).length) {
            if (!gistSelection || !gistSelection.length) return true;
            return gistSelection.some(function(name) {
                return name !== GIST_NOT_ASSIGNED && gistNameMatchesKeywords(name, row.gist);
            });
        }

        return false;
    });
}

   LOAD
   Everything is calculated live from Deals, Accounts and Calls.

function loadReport() {

    var button = document.getElementById("refreshButton");

    button.disabled = true;
    button.innerText = "Loading...";

    callsCache = {};

}


/* =========================================================
   LIVE DEALS + ACCOUNTS
   ========================================================= */

function loadLiveData() {

    if (!liveDataPromise) {

        liveDataPromise = Promise.all([
            getFieldsSafe("Deals"),
            getFieldsSafe("Accounts"),
            zohoSearchAll("Deals", null),
            zohoSearchAll("Accounts", null)
        ]).then(function(results) {
            liveResolved = buildLiveData(results[0], results[1], results[2] || [], results[3] || []);
            return liveResolved;
        });

        liveDataPromise.catch(function() { liveDataPromise = null; });
    }

    return liveDataPromise;
}


function getFieldsSafe(entity) {
    try {
        if (!ZOHO.CRM.META || !ZOHO.CRM.META.getFields) return Promise.resolve([]);
        return ZOHO.CRM.META.getFields({ Entity: entity })
            .then(function(response) {
                var fields = response && (response.fields || response.data);
                return Array.isArray(fields) ? fields : [];
            })
            .catch(function() { return []; });
    } catch (e) {
        return Promise.resolve([]);
    }
}


function fieldValueList(value) {
    if (value === undefined || value === null || value === "") return [];
    if (Array.isArray(value)) {
        var out = [];
        value.forEach(function(v) { out = out.concat(fieldValueList(v)); });
        return out;
    }
    if (typeof value === "object") {
        var text = value.name || value.display_value || value.value || value.full_name || "";
        return String(text).trim() ? [String(text).trim()] : [];
    }
    var s = String(value).trim();
    return s ? [s] : [];
}


function fieldValueText(value) {
    return fieldValueList(value).join(", ");
}


function parseNumber(value) {
    if (value && typeof value === "object") value = value.value !== undefined ? value.value : value.amount;
    if (value === undefined || value === null || value === "" || typeof value === "boolean") return 0;
    var parsed = Number(String(value).replace(/,/g, "").replace(/[₹$\s]|Rs\.?|INR/gi, ""));
    return isNaN(parsed) ? 0 : parsed;
}


function fieldOptions(meta, records) {
    var options = [];
    var seen = {};

    (meta || []).forEach(function(f) {
        if (!f || !f.api_name || seen[f.api_name]) return;
        seen[f.api_name] = true;
        options.push({ api: f.api_name, label: f.field_label || f.api_name, type: String(f.data_type || "").toLowerCase() });
    });

    (records || []).slice(0, 300).forEach(function(r) {
        Object.keys(r || {}).forEach(function(k) {
            if (seen[k]) return;
            seen[k] = true;
            options.push({ api: k, label: k, type: "" });
        });
    });

    return options;
}


function optionText(o) {
    return (o.label + " " + o.api.replace(/_/g, " ")).toLowerCase();
}


function describeField(api, options, found) {
    for (var i = 0; i < options.length; i++) {
        if (options[i].api === api) return { api: api, label: options[i].label, found: !!found };
    }
    return { api: api, label: api, found: !!found };
}


function pickByTiers(options, tiers, scoreFn) {
    for (var t = 0; t < tiers.length; t++) {
        var best = null;
        var bestScore = 0;
        options.forEach(function(o) {
            if (!tiers[t](o)) return;
            var score = scoreFn(o.api);
            if (score > bestScore) { best = o; bestScore = score; }
        });
        if (best) return { api: best.api, label: best.label, found: true };
    }
    return null;
}


function countNonEmpty(records, api) {
    var n = 0;
    records.forEach(function(r) { if (fieldValueList(r[api]).length) n++; });
    return n;
}


function countNonZero(records, api) {
    var n = 0;
    records.forEach(function(r) { if (parseNumber(r[api]) !== 0) n++; });
    return n;
}


function countDealTypeMatches(records, api) {
    var n = 0;
    records.forEach(function(r) { if (valueIsNewDealType(r[api])) n++; });
    return n;
}


function valueIsNewDealType(value) {
    var wanted = DEAL_TYPE_VALUES.map(function(v) { return v.trim().toLowerCase(); });
    return fieldValueList(value).some(function(v) { return wanted.indexOf(v.trim().toLowerCase()) !== -1; });
}


function chooseDetailField(explicit, patterns, dealOptions, deals, accountOptions, accounts) {
    var tiers = patterns.map(function(re) { return function(o) { return re.test(optionText(o)); }; });
    if (explicit) {
        var onDeals = dealOptions.some(function(o) { return o.api === explicit; });
        return { module: onDeals ? "Deals" : "Accounts", api: explicit, label: explicit, found: true };
    }
    var d = pickByTiers(dealOptions, tiers, function(api) { return countNonEmpty(deals, api) || 0.5; });
    if (d) return { module: "Deals", api: d.api, label: d.label, found: true };
    var a = pickByTiers(accountOptions, tiers, function(api) { return countNonEmpty(accounts, api) || 0.5; });
    if (a) return { module: "Accounts", api: a.api, label: a.label, found: true };
    return { module: "", api: "", label: "", found: false };
}


function chooseDateField(explicit, patterns, fallbackApi, options, deals) {
    if (explicit) return describeField(explicit, options, true);
    var tiers = patterns.map(function(re) { return function(o) { return re.test(optionText(o)); }; });
    var picked = pickByTiers(options, tiers, function(api) { return countNonEmpty(deals, api); });
    if (picked) return picked;
    for (var i = 0; i < options.length; i++) {
        if (patterns[0].test(optionText(options[i]))) return { api: options[i].api, label: options[i].label, found: true };
    }
    return describeField(fallbackApi, options, false);
}


function chooseYearField(options, deals) {
    if (DEAL_FIELDS.year) return describeField(DEAL_FIELDS.year, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Year2"; },
        function(o) { return /\bdeal year\b|\bfiscal year\b|\bfinancial year\b|\bfy\b/.test(optionText(o)); },
        function(o) { return /\byear\b/.test(optionText(o)) && o.type !== "date" && o.type !== "datetime"; }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Year2", options, false);
}


var NOT_AMOUNT_WORDS = /probab|percent|discount|tax|qty|quantity|days|score|phone|mobile|pin ?code|zip|year|count|rating|number of|no of|exchange rate|\bid\b/;

function isAmountLike(o) {
    var numericTypes = ["currency", "double", "integer", "bigint", "formula", "decimal", "long", ""];
    return numericTypes.indexOf(o.type) !== -1 && !NOT_AMOUNT_WORDS.test(optionText(o));
}


function chooseAmountField(options, deals) {
    if (DEAL_FIELDS.amount) return describeField(DEAL_FIELDS.amount, options, true);
    var picked = pickByTiers(options, [
        function(o) { return /expected ?business/.test(optionText(o)); }
    ], function(api) { return countNonZero(deals, api); });
    if (picked) return picked;
    for (var i = 0; i < options.length; i++) {
        if (/expected ?business/.test(optionText(options[i]))) return { api: options[i].api, label: options[i].label, found: true };
    }
    return pickByTiers(options, [
        function(o) { return o.api === "Amount"; },
        function(o) { return isAmountLike(o) && /business|lakh|amount|value|revenue/.test(optionText(o)); }
    ], function(api) { return countNonZero(deals, api); }) || describeField("Amount", options, false);
}


function choosePlanField(options, deals) {
    if (DEAL_FIELDS.plan) return describeField(DEAL_FIELDS.plan, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Deal_Category"; },
        function(o) { return /\bplan\b/.test(optionText(o)); },
        function(o) { return /categor/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Deal_Category", options, false);
}


function chooseProductField(options, deals) {
    if (DEAL_FIELDS.product) return describeField(DEAL_FIELDS.product, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Product" || o.api === "Product_Name"; },
        function(o) { return /\bproducts?\b/.test(optionText(o)) && !/amount|price|qty|quantity|code|\bid\b/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Product", options, false);
}


function chooseDealTypeField(options, deals) {
    if (DEAL_FIELDS.dealType) return describeField(DEAL_FIELDS.dealType, options, true);
    return pickByTiers(options, [
        function(o) { return /deal ?type/.test(optionText(o)); },
        function(o) { return o.api === "Type"; },
        function(o) { return /\btype\b/.test(optionText(o)); }
    ], function(api) { return countDealTypeMatches(deals, api); }) || describeField("Type", options, false);
}


function chooseGistField(options, accounts) {
    if (ACCOUNT_GIST_FIELD) return describeField(ACCOUNT_GIST_FIELD, options, true);
    return pickByTiers(options, [
        function(o) { return /gist.*account.*owner/.test(optionText(o)); },
        function(o) { return /gist.*owner/.test(optionText(o)); },
        function(o) { return /gist/.test(optionText(o)) && !/bucket/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(accounts, api); }) || describeField("GIST_Account_Owner", options, false);
}


function buildLiveData(dealMeta, accountMeta, deals, accounts) {

    var dealOptions = fieldOptions(dealMeta, deals);
    var accountOptions = fieldOptions(accountMeta, accounts);

    fieldInfo = {};
    fieldInfo.expectedOrderDate = chooseDateField(DEAL_FIELDS.expectedOrderDate,
        [/expected order date/, /expected.*order.*date/], "Expected_Order_Date", dealOptions, deals);
    fieldInfo.actualOrderDate = chooseDateField(DEAL_FIELDS.actualOrderDate,
        [/actual order date/, /actual.*order.*date/], "Actual_Order_Date", dealOptions, deals);
    fieldInfo.paymentDate = chooseDateField(DEAL_FIELDS.paymentDate,
        [/payment receiv(ing|ed) date/, /payment.*date/], "Payment_Receiving_Date", dealOptions, deals);
    fieldInfo.closingDate = DEAL_FIELDS.closingDate
        ? describeField(DEAL_FIELDS.closingDate, dealOptions, true)
        : (function() {
            var std = describeField("Closing_Date", dealOptions, true);
            var exists = dealOptions.some(function(o) { return o.api === "Closing_Date"; });
            return exists ? std : chooseDateField("", [/^closing date\b/, /\bclosing date\b/], "Closing_Date", dealOptions, deals);
        })();
    fieldInfo.year = chooseYearField(dealOptions, deals);
    fieldInfo.dealType = chooseDealTypeField(dealOptions, deals);

    var fyDeals = deals.filter(function(d) { return dealFiscalYear(d) === FY_FILTER && dealTypeOk(d); });
    var scope = fyDeals.length ? fyDeals : deals;

    fieldInfo.amount = chooseAmountField(dealOptions, scope);
    fieldInfo.plan = choosePlanField(dealOptions, scope);
    fieldInfo.product = chooseProductField(dealOptions, scope);

    var gistHqAccounts = accounts.filter(function(a) { return isGistHqName(ddLookupName(a.Owner, "")); });
    fieldInfo.gist = chooseGistField(accountOptions, gistHqAccounts.length ? gistHqAccounts : accounts);

    // Extra columns for the top-card detail popups (Deals first, then Accounts)
    fieldInfo.ouCode = chooseDetailField(DETAIL_FIELDS.ouCode, [/\bou code\b/, /\bou\b/], dealOptions, deals, accountOptions, accounts);
    fieldInfo.subStartDate = chooseDetailField(DETAIL_FIELDS.subStartDate,
        [/sub(scription)? start date/, /sub(scription)?.*start/], dealOptions, deals, accountOptions, accounts);

    amountUnitInUse = decideAmountUnit(scope);

    fieldInfo.paymentAmount = DEAL_FIELDS.paymentAmount
        ? describeField(DEAL_FIELDS.paymentAmount, dealOptions, true)
        : (pickByTiers(dealOptions, [
              function(o) { return /payment receiv(ed|ing) amount/.test(optionText(o)); },
              function(o) { return /payment.*amount|received amount/.test(optionText(o)); }
          ], function(api) { return countNonZero(scope, api) || 0.5; }) || describeField("Payment_Received_Amount", dealOptions, false));
    paymentAmountUnitInUse = decideUnitForField(fieldInfo.paymentAmount, scope);

    var scopedAccountIds = {};
    deals.forEach(function(d) {
        if (!dealTypeOk(d)) return;
        var accId = ddLookupId(d.Account_Name);
        if (accId) scopedAccountIds[accId] = true;
    });

    var accountsById = {};
    var ownerIdByName = {};
    var gistSet = {};
    var gistHasEmpty = false;
    var teamAccountCounts = SALES_TEAM_TARGETS.map(function() { return 0; });

    accounts.forEach(function(a) {

        if (!a.id) return;

        var ownerName = ddLookupName(a.Owner, "Unassigned");
        var ownerId = ddLookupId(a.Owner);
        var gistNames = fieldValueList(a[fieldInfo.gist.api]);

        var account = {
            id: String(a.id),
            name: a.Account_Name || "(Unnamed Account)",
            ownerId: ownerId,
            ownerName: ownerName,
            bucket: fieldValueText(a.Bucket_Type) || "No Bucket",
            gistNames: gistNames,
            inScope: !!scopedAccountIds[String(a.id)],
            raw: a
        };

        account.teamIndex = assignTeam(account);
        if (account.teamIndex >= 0) teamAccountCounts[account.teamIndex]++;

        accountsById[account.id] = account;

        if (ownerId) ownerIdByName[ownerName.trim().toLowerCase()] = ownerId;

        if (isGistHqName(ownerName)) {
            if (gistNames.length === 0) gistHasEmpty = true;
            gistNames.forEach(function(n) { gistSet[n] = true; });
        }
    });

    var gistValues = Object.keys(gistSet).sort(function(a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    if (gistHasEmpty) gistValues.push(GIST_NOT_ASSIGNED);

    var outsideWindow = fyDeals.filter(function(d) {
        return !isRemovedStage(d.Stage) && !stageDateQuarter(d);
    }).length;

    var newDealsByAccount = {};
    var dealAccount = {};
    deals.forEach(function(d) {
        var accId = ddLookupId(d.Account_Name);
        if (!accId) return;
        if (d.id) dealAccount[String(d.id)] = accId;
        if (!dealTypeOk(d)) return;
        (newDealsByAccount[accId] = newDealsByAccount[accId] || []).push(d);
    });

    // Lost - No Follow-up: every Deal Type New deal is Closed Lost (no open or won deal left)
    Object.keys(accountsById).forEach(function(id) {
        var list = (newDealsByAccount[id] || []).filter(function(d) { return !isRemovedStage(d.Stage); });
        accountsById[id].lostOnly = list.length > 0 && list.every(function(d) { return isClosedLostStage(d.Stage); });
    });

    return {
        deals: deals,
        newDealsByAccount: newDealsByAccount,
        dealAccount: dealAccount,
        accountsById: accountsById,
        ownerIdByName: ownerIdByName,
        gistValues: gistValues,
        gistHqAccountCount: gistHqAccounts.length,
        teamAccountCounts: teamAccountCounts,
        yearDealCount: deals.filter(function(d) { return dealFiscalYear(d) === FY_FILTER; }).length,
        fyDealCount: fyDeals.length,
        outsideWindow: outsideWindow
    };
}


function dealHasExcludedProduct(deal) {
    var excluded = EXCLUDED_PRODUCTS.map(function(p) { return p.trim().toLowerCase(); });
    return fieldValueList(deal[fieldInfo.product.api]).some(function(p) { return excluded.indexOf(p.trim().toLowerCase()) !== -1; });
}


function dealTypeOk(deal) {
    if (!fieldInfo.dealType.found) return true;   // field not found: don't hide everything, a warning is shown
    return valueIsNewDealType(deal[fieldInfo.dealType.api]);
}


function rawDealAmount(deal) {
    return parseNumber(deal ? deal[fieldInfo.amount.api] : null);
}


function decideAmountUnit(deals) {

    if (AMOUNT_UNIT === "lakh" || AMOUNT_UNIT === "rupees") return AMOUNT_UNIT;
    if (/lakh|\blac\b/i.test(fieldInfo.amount.label + " " + fieldInfo.amount.api)) return "lakh";

    var values = [];
    deals.forEach(function(deal) {
        var v = Math.abs(rawDealAmount(deal));
        if (v) values.push(v);
    });

    if (values.length === 0) return "rupees";

    values.sort(function(a, b) { return a - b; });
    return values[Math.floor(values.length / 2)] < 1000 ? "lakh" : "rupees";
}


function decideUnitForField(field, deals) {
    if (AMOUNT_UNIT === "lakh" || AMOUNT_UNIT === "rupees") return AMOUNT_UNIT;
    if (/lakh|\blac\b/i.test(field.label + " " + field.api)) return "lakh";
    var values = [];
    deals.forEach(function(deal) {
        var v = Math.abs(parseNumber(deal[field.api]));
        if (v) values.push(v);
    });
    if (!values.length) return "rupees";
    values.sort(function(a, b) { return a - b; });
    return values[Math.floor(values.length / 2)] < 1000 ? "lakh" : "rupees";
}


function paymentAmountLakh(deal) {
    var raw = parseNumber(deal ? deal[fieldInfo.paymentAmount.api] : null);
    return paymentAmountUnitInUse === "lakh" ? raw : raw / 100000;
}


function dealAmountLakh(deal) {
    var raw = rawDealAmount(deal);
    return amountUnitInUse === "lakh" ? raw : raw / 100000;
}


function dealPlanName(deal) {
    return fieldValueText(deal ? deal[fieldInfo.plan.api] : null) || "No Plan";
}


function dealFiscalYear(deal) {

    var value = fieldValueText(deal ? deal[fieldInfo.year.api] : null);

    if (value) {
        value = value.replace(/^FY\s*/i, "").replace(/\s+/g, "");
        var full = value.match(/^(\d{4})[-\/](\d{4})$/);
        if (full) return full[1] + "-" + full[2];
        var shortEnd = value.match(/^(\d{4})[-\/](\d{2})$/);
        if (shortEnd) return shortEnd[1] + "-" + (Number(shortEnd[1]) + 1);
        var bothShort = value.match(/^(\d{2})[-\/](\d{2})$/);
        if (bothShort) return "20" + bothShort[1] + "-20" + bothShort[2];
        return value;
    }

    var date = ddParseDate(deal && deal[fieldInfo.closingDate.api]);
    if (!date) return "";
    var year = date.getFullYear();
    return (date.getMonth() >= 3) ? (year + "-" + (year + 1)) : ((year - 1) + "-" + year);
}


function isInFyWindow(date) {
    return !!date && date >= FY_START && date <= FY_END;
}


function fyQuarterOf(value) {
    var date = ddParseDate(value);
    return isInFyWindow(date) ? monthQuarter(date) : null;
}


/* FY quarter of each deal date (null when blank or outside the FY) */
function dealDateQuarters(deal) {
    return {
        expected: fyQuarterOf(deal[fieldInfo.expectedOrderDate.api]),
        actual: fyQuarterOf(deal[fieldInfo.actualOrderDate.api]),
        payment: fyQuarterOf(deal[fieldInfo.paymentDate.api]),
        closing: fyQuarterOf(deal[fieldInfo.closingDate.api])
    };
}


/* Quarter from the date that matches the deal's stage */
function stageDateQuarter(deal, quarters) {
    quarters = quarters || dealDateQuarters(deal);
    if (isRemovedStage(deal.Stage)) return null;
    if (isClosedWonStage(deal.Stage)) return quarters.actual;
    if (isClosedLostStage(deal.Stage)) return quarters.closing;
    return quarters.expected;
}


function stageDateName(stage) {
    if (isClosedWonStage(stage)) return "Actual Order Date";
    if (isClosedLostStage(stage)) return "Closing Date";
    return "Expected Order Date";
}


/* =========================================================
   DEAL RULES
   ========================================================= */

function stageGroupOf(stage) {
    var key = normStage(stage);
    if (REMOVED_STAGE_KEYS.indexOf(key) !== -1) return null;
    return STAGE_TO_GROUP[key] || String(stage || "").trim() || "Unknown";
}


function isRemovedStage(stage) {
    return REMOVED_STAGE_KEYS.indexOf(normStage(stage)) !== -1;
}


function isClosedWonStage(stage) {
    return CLOSED_WON_KEYS.indexOf(normStage(stage)) !== -1;
}


function isClosedLostStage(stage) {
    return CLOSED_LOST_KEYS.indexOf(normStage(stage)) !== -1;
}


/* Open = not Closed Won, not Closed Lost, not removed (Order Booked is open) */
function isOpenStage(stage) {
    return !isClosedWonStage(stage) && !isClosedLostStage(stage) && !isRemovedStage(stage);
}


function isExcludedTestDeal(deal) {
    var name = String((deal && deal.Deal_Name) || "").toLowerCase();
    return EXCLUDED_DEAL_NAME_WORDS.some(function(word) { return name.indexOf(word) !== -1; });
}


function hasExcludedProduct(ctx) {
    var excluded = EXCLUDED_PRODUCTS.map(function(p) { return p.trim().toLowerCase(); });
    return ctx.products.some(function(p) { return excluded.indexOf(p.trim().toLowerCase()) !== -1; });
}


/* gistSelection = array of Gist Account Owner names; empty = no filter */
function accountMatchesGist(account, gistSelection) {
    if (!gistSelection || !gistSelection.length) return true;
    if (!account) return false;
    if (gistSelection.indexOf(GIST_NOT_ASSIGNED) !== -1 && account.gistNames.length === 0) return true;
    return account.gistNames.some(function(n) { return gistSelection.indexOf(n) !== -1; });
}


/*
 * Every number on the dashboard starts here: Deal Year, Deal Type = New,
 * linked account, Gist filter and quarter.
 * cardMode = true skips the "Expected Order Date inside the FY" check (top cards).
 */
function dealContext(deal, live, selectedQuarter, gistSelection, cardMode) {

    if (dealFiscalYear(deal) !== FY_FILTER) return null;
    if (!dealTypeOk(deal)) return null;

    var accId = ddLookupId(deal.Account_Name);
    if (!accId) return null;

    var dateQuarters = dealDateQuarters(deal);
    var quarter = stageDateQuarter(deal, dateQuarters);
    var inWindow = !!quarter;
    if (!cardMode && !inWindow) return null;

    var allQuarters = !selectedQuarter || selectedQuarter === ALL_QUARTERS;
    if (!cardMode && !allQuarters && quarter !== selectedQuarter) return null;

    var account = live.accountsById[accId] || null;
    if (!accountMatchesGist(account, gistSelection)) return null;

    return {
        accId: accId,
        account: account,
        accName: account ? account.name : ddLookupName(deal.Account_Name, "(Unnamed Account)"),
        quarter: quarter,
        inWindow: inWindow,
        dateQuarters: dateQuarters,
        selectedQuarter: allQuarters ? ALL_QUARTERS : selectedQuarter,
        stage: String(deal.Stage || "").trim() || "Unknown",
        amount: dealAmountLakh(deal),
        paymentAmount: paymentAmountLakh(deal),
        plan: dealPlanName(deal),
        products: fieldValueList(deal[fieldInfo.product.api]),
        dealOwnerId: ddLookupId(deal.Owner),
        dealOwnerName: ddLookupName(deal.Owner, ""),
        excluded: isExcludedTestDeal(deal)
    };
}


/* Quarter x Plan and Stage-wise funnel: stage date in FY, no Knimbus Default, no removed stages */
function chartEligible(ctx) {
    if (!ctx.inWindow) return false;
    if (hasExcludedProduct(ctx)) return false;
    return stageGroupOf(ctx.stage) !== null;
}


/* Open pipeline deal. applyProductRule = true only for the Current Pipeline card */
function isPipelineDeal(ctx, applyProductRule) {
    if (applyProductRule && hasExcludedProduct(ctx)) return false;
    if (isRemovedStage(ctx.stage)) return false;
    if (PIPELINE_OPEN_STAGES_ONLY && !isOpenStage(ctx.stage)) return false;
    return true;
}


/* ownerSet = { userId: true } for the selected owners */
function ownerSetFromNames(names, live) {
    var set = {};
    var missing = [];
    names.forEach(function(name) {
        var id = live.ownerIdByName[name.trim().toLowerCase()];
        if (!id && currentUser && name.trim().toLowerCase() === currentUser.name.toLowerCase()) id = currentUser.id;
        if (id) set[id] = true;
        else missing.push(name);
    });
    return { set: set, missing: missing };
}


/* Cards: scoped to the DEAL owner */
function matchesCardCategory(ctx, category, ownerSet) {
    if (!ownerSet[ctx.dealOwnerId]) return false;
    return cardStageMatch(ctx, category);
}


/* The card rules without the owner check (also used by Target vs Achievement) */
function cardStageMatch(ctx, category, ignoreDate) {

    if (isRemovedStage(ctx.stage)) return false;

    var quarterPicked = ctx.selectedQuarter && ctx.selectedQuarter !== ALL_QUARTERS;
    var q = ctx.dateQuarters;

    function dateOk(quarter) {
        if (ignoreDate) return true;
        return !!quarter && (!quarterPicked || quarter === ctx.selectedQuarter);
    }

    if (category === "achieved") {
        return isClosedWonStage(ctx.stage) && !ctx.excluded && dateOk(q.actual);
    }
    if (category === "payment_received") {
        return PAYMENT_RECEIVED_KEYS.indexOf(normStage(ctx.stage)) !== -1 && !ctx.excluded && dateOk(q.payment);
    }
    if (category === "payment_pending") {
        return PAYMENT_PENDING_KEYS.indexOf(normStage(ctx.stage)) !== -1 && dateOk(q.closing);
    }
    if (category === "current_pipeline" || category === "current_pipeline_all_products") {
        if (!dateOk(q.expected)) return false;
        if (!isPipelineDeal(ctx, category === "current_pipeline")) return false;
        return !PIPELINE_REQUIRE_SAME_OWNER || (!!ctx.account && ctx.account.ownerId === ctx.dealOwnerId);
    }
    return false;
}


/* Payment Received card adds up Payment Received Amount; the other cards use Expected Business */
function cardAmount(ctx, category) {
    return category === "payment_received" ? ctx.paymentAmount : ctx.amount;
}


/* Charts and summary: scoped to the ACCOUNT owner */
function matchesAccountOwner(ctx, ownerSet) {
    return !!ctx.account && !!ownerSet[ctx.account.ownerId];
}


function countsAsExpected(ctx) {
    return !(EXCLUDE_LOST_FROM_EXPECTED && isClosedLostStage(ctx.stage));
}


function addAmount(target, key, amount, accId) {
    if (!target[key]) target[key] = { amount_lakh: 0, count: 0, accounts: {} };
    target[key].amount_lakh += amount;
    target[key].count += 1;
    if (accId) target[key].accounts[accId] = true;
}


/* =========================================================
   METRICS
   ========================================================= */

function computeDealMetrics(live, ownerSet, gistSelection, selectedQuarter) {

    var quarters = selectedQuarter && selectedQuarter !== ALL_QUARTERS ? [selectedQuarter] : QUARTERS.slice();

    var m = {
        quarters: quarters,
        plans: [],
        matrix: {},
        pipelineByQuarter: {},
        planTotals: {},
        groupTotals: {},
        groupStages: {},
        cards: { achieved: 0, payment_received: 0, payment_pending: 0, current_pipeline: 0 },
        pipelineAccounts: {},
        leftOut: { achieved: { amount_lakh: 0, count: 0 }, payment_received: { amount_lakh: 0, count: 0 },
                   payment_pending: { amount_lakh: 0, count: 0 }, current_pipeline: { amount_lakh: 0, count: 0 } },
        pipelineTableAccounts: {},
        chartDeals: 0,
        dealsWithAmount: 0,
        dealsWithPlan: 0
    };

    quarters.forEach(function(q) {
        m.matrix[q] = {};
        m.pipelineByQuarter[q] = { amount_lakh: 0, count: 0, accounts: {} };
    });

    live.deals.forEach(function(deal) {

        var ctx = dealContext(deal, live, selectedQuarter, gistSelection, true);
        if (!ctx) return;

        CARD_CATEGORIES.forEach(function(category) {
            if (!matchesCardCategory(ctx, category, ownerSet)) return;
            m.cards[category] += cardAmount(ctx, category);
            if (category === "current_pipeline") m.pipelineAccounts[ctx.accId] = true;
        });

        // Deals that match a card except for its date (shown under the card)
        if (ownerSet[ctx.dealOwnerId] && ctx.selectedQuarter === ALL_QUARTERS) {
            CARD_CATEGORIES.forEach(function(category) {
                if (!cardStageMatch(ctx, category) && cardStageMatch(ctx, category, true)) {
                    m.leftOut[category].amount_lakh += cardAmount(ctx, category);
                    m.leftOut[category].count += 1;
                }
            });
        }

        if (!chartEligible(ctx)) return;
        if (ctx.selectedQuarter !== ALL_QUARTERS && ctx.quarter !== ctx.selectedQuarter) return;
        if (!matchesAccountOwner(ctx, ownerSet)) return;

        m.chartDeals++;
        if (ctx.amount) m.dealsWithAmount++;
        if (ctx.plan !== "No Plan") m.dealsWithPlan++;

        var group = stageGroupOf(ctx.stage);
        addAmount(m.groupTotals, group, ctx.amount, ctx.accId);
        if (!m.groupStages[group]) m.groupStages[group] = {};
        m.groupStages[group][ctx.stage] = true;

        if (!ctx.quarter) return;

        if (countsAsExpected(ctx)) {
            addAmount(m.matrix[ctx.quarter], ctx.plan, ctx.amount, ctx.accId);
            addAmount(m.planTotals, ctx.plan, ctx.amount, ctx.accId);
        }

        if (isPipelineDeal(ctx)) {
            m.pipelineByQuarter[ctx.quarter].amount_lakh += ctx.amount;
            m.pipelineByQuarter[ctx.quarter].count += 1;
            m.pipelineByQuarter[ctx.quarter].accounts[ctx.accId] = true;
            m.pipelineTableAccounts[ctx.accId] = true;
        }
    });

    var known = ["Plan A", "Plan B", "Plan C"];
    var found = Object.keys(m.planTotals);

    m.plans = known.filter(function(p) { return found.indexOf(p) !== -1; });
    found.sort().forEach(function(p) {
        if (m.plans.indexOf(p) === -1 && p !== "No Plan") m.plans.push(p);
    });
    // Deals without a plan are not shown in Quarter x Plan

    m.groups = orderedGroups(Object.keys(m.groupTotals));

    return m;
}


function orderedGroups(present) {
    var ordered = STAGE_GROUPS.map(function(g) { return g.name; }).filter(function(n) { return present.indexOf(n) !== -1; });
    var closedIndex = ordered.indexOf("Closed Won");
    var extras = present.filter(function(n) { return ordered.indexOf(n) === -1; }).sort();
    if (closedIndex === -1) return ordered.concat(extras);
    return ordered.slice(0, closedIndex).concat(extras, ordered.slice(closedIndex));
}


/*
 * Target vs Achievement uses exactly the Achieved card rules:
 * deal owner, Closed Won stages, Deal Type New, Deal Year, test deals left out.
 * Owner teams match on the DEAL owner. Gist teams match deals owned by
 * GIST HQ on GIST HQ accounts whose Gist Account Owner matches the team.
 */
function teamIndexForDeal(ctx) {

    var dealOwner = ctx.dealOwnerName.trim().toLowerCase();

    for (var i = 0; i < SALES_TEAM_TARGETS.length; i++) {
        if ((SALES_TEAM_TARGETS[i].owners || []).some(function(o) { return o.trim().toLowerCase() === dealOwner; })) return i;
    }

    if (isGistHqName(ctx.dealOwnerName) && ctx.account && isGistHqName(ctx.account.ownerName)) {
        for (var j = 0; j < SALES_TEAM_TARGETS.length; j++) {
            var row = SALES_TEAM_TARGETS[j];
            if ((row.gist || []).length && ctx.account.gistNames.some(function(n) { return gistNameMatchesKeywords(n, row.gist); })) return j;
        }
    }

    return -1;
}


function computeTeamMetrics(live) {

    var teams = SALES_TEAM_TARGETS.map(function() {
        var t = { achievedFY: 0, achieved: {}, pipelineA: {} };
        QUARTERS.forEach(function(q) { t.achieved[q] = 0; t.pipelineA[q] = 0; });
        return t;
    });

    live.deals.forEach(function(deal) {

        var ctx = dealContext(deal, live, ALL_QUARTERS, [], true);
        if (!ctx) return;

        var index = teamIndexForDeal(ctx);
        if (index < 0) return;

        if (cardStageMatch(ctx, "achieved")) {
            teams[index].achievedFY += ctx.amount;
            teams[index].achieved[ctx.dateQuarters.actual] += ctx.amount;
        }

        if (cardStageMatch(ctx, "current_pipeline_all_products") && ctx.plan.trim().toLowerCase() === "plan a") {
            teams[index].pipelineA[ctx.dateQuarters.expected] += ctx.amount;
        }
    });

    return teams;
}


/* Closed Won / Closed Lost accounts per owner and per Gist Account Owner (Deal Type New) */
function computeWonLost(live, selectedQuarter, gistSelection) {

    var result = { owners: {}, gist: {} };

    function bucketFor(map, key) {
        if (!map[key]) map[key] = { won: {}, lost: {} };
        return map[key];
    }

    live.deals.forEach(function(deal) {

        var ctx = dealContext(deal, live, selectedQuarter, gistSelection, false);
        if (!ctx || !ctx.account || isRemovedStage(ctx.stage)) return;

        var isWon = isClosedWonStage(ctx.stage) && !ctx.excluded;
        var isLost = isClosedLostStage(ctx.stage);
        if (!isWon && !isLost) return;

        var targets = [bucketFor(result.owners, ctx.account.ownerId)];

        if (isGistHqName(ctx.account.ownerName)) {
            var names = ctx.account.gistNames.length ? ctx.account.gistNames : [GIST_NOT_ASSIGNED];
            names.forEach(function(n) { targets.push(bucketFor(result.gist, n)); });
        }

        targets.forEach(function(b) {
            if (isWon) b.won[ctx.accId] = true;
            else b.lost[ctx.accId] = true;
        });
    });

    return result;
}


/* =========================================================
   ACCOUNT ACTIVITY (live, Deal Type New accounts only)
   ========================================================= */

function filterAccounts(live, ownerSet, gistSelection) {
    var list = [];
    Object.keys(live.accountsById).forEach(function(id) {
        var a = live.accountsById[id];
        if (!a.inScope) return;
        if (!ownerSet[a.ownerId]) return;
        if (!accountMatchesGist(a, gistSelection)) return;
        list.push(a);
    });
    return list;
}


function getAllCalls() {
    if (!callsCache.__all__) callsCache.__all__ = zohoSearchAll("Calls", null);
    return callsCache.__all__;
}


function getOwnerCalls(ownerId) {

    if (!callsCache[ownerId]) {
        callsCache[ownerId] = zohoSearchAll("Calls", "(Owner:equals:" + ownerId + ")").then(function(calls) {
            // Zoho search stops at 2,000 results; fall back to the full list if we hit that
            if (calls.length >= 2000) {
                return getAllCalls().then(function(all) {
                    return all.filter(function(c) { return ddLookupId(c.Owner) === ownerId; });
                });
            }
            return calls;
        });
    }

    return callsCache[ownerId];
}


function getCallsForOwners(ownerSet) {
    var ids = Object.keys(ownerSet);
    return Promise.all(ids.map(getOwnerCalls)).then(function(lists) {
        var out = [];
        lists.forEach(function(l) { out = out.concat(l); });
        return out;
    });
}


function latestOwnerCalls(accounts, calls) {

    var byId = {};
    accounts.forEach(function(a) { byId[a.id] = a; });

    var latest = {};

    var dealAccount = (liveResolved && liveResolved.dealAccount) || {};

    calls.forEach(function(call) {
        var whatId = ddLookupId(call.What_Id);
        // A call logged on a deal counts for that deal's account
        var accId = byId[whatId] ? whatId : dealAccount[whatId];
        var account = accId ? byId[accId] : null;
        if (!account) return;
        if (ddLookupId(call.Owner) !== account.ownerId) return;
        var date = ddParseDate(call.Call_Start_Time);
        if (!date) return;
        if (!latest[accId] || date > latest[accId]) latest[accId] = date;
    });

    return latest;
}


function agingOf(date) {
    var days = Math.floor((new Date() - date) / 86400000);
    if (days <= 30) return "last_30";
    if (days <= 60) return "days_31_60";
    return "days_60_plus";
}


/*
 * Per account: does it have a Deal Type New, Deal Year FY deal that is open /
 * Closed Won / Closed Lost, with that stage's date in the FY (and the selected quarter)?
 * Open = Expected Order Date, Closed Won = Actual Order Date, Closed Lost = Closing Date.
 */
function computeAccountDealStatus(live, selectedQuarter, gistSelection) {
    var status = {};
    live.deals.forEach(function(deal) {
        var ctx = dealContext(deal, live, selectedQuarter, gistSelection, false);
        if (!ctx || isRemovedStage(ctx.stage)) return;
        var st = status[ctx.accId] || (status[ctx.accId] = { open: false, won: false, lost: false });
        if (isClosedWonStage(ctx.stage)) { if (!ctx.excluded) st.won = true; }
        else if (isClosedLostStage(ctx.stage)) st.lost = true;
        else st.open = true;
    });
    return status;
}


function computeAccountStats(accounts, calls, dealStatus) {

    var latest = latestOwnerCalls(accounts, calls);
    var stats = { total: 0, touched: 0, untouched: 0, lost: 0, last_30: 0, days_31_60: 0, days_60_plus: 0, bucket_summary: {} };

    accounts.forEach(function(a) {

        stats.total++;

        if (!stats.bucket_summary[a.bucket]) {
            stats.bucket_summary[a.bucket] = { Total: 0, open_deals: 0, closed_lost: 0, closed_won: 0,
                last_30: 0, days_31_60: 0, days_60_plus: 0, non_touched: 0, lost_nf: 0 };
        }

        var bs = stats.bucket_summary[a.bucket];
        bs.Total++;

        var ds = dealStatus && dealStatus[a.id];
        if (ds) {
            if (ds.open) bs.open_deals++;
            if (ds.lost) bs.closed_lost++;
            if (ds.won) bs.closed_won++;
        }

        // Lost-only accounts sit in their own group, even if a call was logged.
        // Reopening the deal makes the account active again.
        if (a.lostOnly) {
            stats.lost++;
            bs.lost_nf++;
            return;
        }

        var lastCall = latest[a.id];

        if (!lastCall) {
            stats.untouched++;
            bs.non_touched++;
        } else {
            var age = agingOf(lastCall);
            stats.touched++;
            stats[age]++;
            bs[age]++;
        }
    });

    return stats;
}


/* =========================================================
   TARGETS FOR THE CURRENT FILTERS
   ========================================================= */

function targetsForFilters(ownerNames, gistSelection) {

    var rows = teamRowsInScope(ownerNames, gistSelection);
    var result = { rows: rows.length, fy: 0, Q1: 0, Q2: 0, Q3: 0, Q4: 0 };

    rows.forEach(function(item) {
        result.fy += teamFyTarget(item.row);
        QUARTERS.forEach(function(q) { result[q] += teamQuarterTarget(item.row, q); });
    });

    return result;
}


function targetValue(targets, selectedQuarter) {
    return selectedQuarter === ALL_QUARTERS ? targets.fy : targets[selectedQuarter];
}


/* =========================================================
   RENDER
   ========================================================= */

function renderAll() {

    if (!personalScope) return;

    var ownerNames = effectiveOwnerNames();

    populateGistOwnerFilter();

        : (allQuarters ? targets.rows + (targets.rows === 1 ? " team" : " teams") : "FY target " + formatLakh(targets.fy));

    html += '<div class="card-row five">';

    html += cardHtml("Achieved (Closed Won)", "Calculating...", "achieved waiting", "achieved");

    html += cardHtml("Touched", "Calculating...", "achieved waiting", "touched");
    html += cardHtml("Untouched Accounts", "Calculating...", "pending waiting", "untouched");
    html += cardHtml("Lost - No Follow-up", "Calculating...", "waiting", "lost_no_followup");
    html += '</div>';

    html += '<div class="section"><h2>Bucket-wise Activity</h2>';
    html += '<p class="section-note">Accounts with a Deal Type New deal. Open Deals, Closed Lost and Closed Won count accounts with a ' +
        'Deal Type New, Deal Year ' + FY_FILTER + ' deal in that stage (Expected Order Date / Closing Date / Actual Order Date in the ' +
        'selected period). Call activity is measured from today, so the quarter filter does not change it. ' +
        'Last 30 + 31-60 + 60+ + Non-Touched + Lost - No Follow-up = Total.</p>';
    html += '<div id="bucketWrap"><div class="loading">Calculating account activity...</div></div>';
    html += '</div>';

    html += '<div class="section"><h2>Expected Business, ' + escapeHtml(period) + '</h2>';
    html += '<h3>Quarter &times; Plan</h3><div id="expectedBusinessWrap"><div class="loading">Loading deals...</div></div>';
    html += '<h3>Target vs Achievement</h3><div id="teamTargetWrap"><div class="loading">Loading deals...</div></div>';
    html += '</div>';

    html += '<div class="section"><h2>Stage-wise Expected Business, ' + escapeHtml(period) + '</h2>';
    html += '<div id="stageFunnelWrap"><div class="loading">Loading deals...</div></div>';
    html += '</div>';

    document.getElementById("content").innerHTML = html;
    document.getElementById("accountOwnerSummarySection").innerHTML = '<div class="loading">Loading account owner summary...</div>';

    loadLiveData()

        .then(async function(live) {

            if (myToken !== renderToken) return;

            if (Object.keys(owners.set).length === 0) {
                showLiveError("No accounts are owned by " + ownerNames.join(", ") + ". Check the names in ALLOWED_ACCOUNT_OWNERS.");
                return;
            }

            var metrics = computeDealMetrics(live, owners.set, gistSelection, selectedQuarter);

            updateAmountCards(metrics.cards, target, metrics.pipelineAccounts, metrics.leftOut);
            renderTeamTable(computeTeamMetrics(live), live, ownerNames, gistSelection, selectedQuarter);
            renderExpectedBusiness(metrics, live, targets, owners.missing);
            renderStageFunnel(metrics);

            aorLive = {
                live: live,
                ownerNames: ownerNames.filter(function(n) { return owners.missing.indexOf(n) === -1; }),
                wonLost: computeWonLost(live, selectedQuarter, gistSelection),
                gistSelection: gistSelection,
                ownerStats: null,
                gistBreakdown: null,
                gistBreakdownLoading: false
            };
            renderAccountOwnerSummary();
            attachDrilldownHandlers();

            var calls = await getCallsForOwners(owners.set);
            if (myToken !== renderToken) return;

            var accounts = filterAccounts(live, owners.set, gistSelection);
            var stats = computeAccountStats(accounts, calls, computeAccountDealStatus(live, selectedQuarter, gistSelection));

            setCardValue("total_accounts", stats.total);
            setCardValue("untouched", stats.untouched);
            setCardValue("touched", stats.touched);
            setCardSub("untouched", accountShareSub(stats.untouched, stats.total));
            setCardSub("touched", accountShareSub(stats.touched, stats.total));
            setCardValue("lost_no_followup", stats.lost);
            setCardSub("lost_no_followup", accountShareSub(stats.lost, stats.total));

            var bucketWrap = document.getElementById("bucketWrap");
            if (bucketWrap) bucketWrap.innerHTML = renderBucketTable(stats.bucket_summary);

            aorLive.ownerStats = {};
            aorLive.ownerNames.forEach(function(name) {
                var single = ownerSetFromNames([name], live).set;
                aorLive.ownerStats[name] = computeAccountStats(filterAccounts(live, single, gistSelection), calls);
            });

            renderAccountOwnerSummary();
            if (aorGistExpanded) ensureGistBreakdown();
            attachDrilldownHandlers();
        })

        .catch(function(err) {
            if (myToken !== renderToken) return;
            console.error("Live data error:", err);
            showLiveError("Could not load data from Zoho CRM. Click Refresh to try again.");
        });
}


function showLiveError(message) {
    var html = '<div class="error">' + escapeHtml(message) + '</div>';

function updateSummaryTitle(selectedQuarter, gistSelection) {

    if (gistSelection && gistSelection.length) title += ", Gist account owner: " + gistSelection.join(", ");
    document.getElementById("aorTitle").innerText = title + ")";
